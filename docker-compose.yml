services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qip
      POSTGRES_PASSWORD: qip
      POSTGRES_DB: qip
    ports:
      - "5432:5432"
    volumes:
      - qip-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qip-data:
