/* ============================================================ interaction */
let pendingFile = null;

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.adminTab = tab.dataset.tab; render(); return; }

  const gran = e.target.closest("[data-gran]");
  if (gran) { state.trendGranularity = gran.dataset.gran; render(); return; }

  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;

  switch (act) {
    case "rail":
      state.railOpen = !state.railOpen;
      $("#rail").classList.toggle("open", state.railOpen);
      break;

    case "theme": {
      const root = document.documentElement;
      const now = root.getAttribute("data-theme");
      const dark = now ? now === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      root.setAttribute("data-theme", dark ? "light" : "dark");
      localStorage.setItem("qip.theme", dark ? "light" : "dark");
      break;
    }

    case "settings": go("#/settings"); break;
    case "print": window.print(); break;
    case "close-modal": closeModal(); break;

    case "upload": uploadModal(); break;
    case "do-upload": doUpload(); break;
    case "analyze": runAnalysis(Number(id)); break;
    case "save-extraction": persistExtraction(Number(btn.dataset.rev)); break;
    case "gen-standard": generateStandard(Number(btn.dataset.rev)); break;

    case "save-standard":
      audit("standard.update", "standard", Number(id));
      save(); render(); toast("Inspection standard saved", "good");
      break;

    case "add-param": {
      const sid = Number(id);
      const seq = db.parameters.filter(p => p.standard_id === sid).length + 1;
      db.parameters.push({
        id: nextId("parameters"), standard_id: sid, seq,
        parameter: "New characteristic", specification: "",
        nominal_value: null, upper_tolerance: null, lower_tolerance: null, unit: "mm",
        inspection_method: "Variable measurement", instrument_id: null, instrument_text: null,
        frequency: "5 pcs per lot", sampling_plan: "ISO 2859-1, Level II, AQL 0.65",
        acceptance_criteria: "", classification: "major", reference_dimension: null, remarks: null,
        is_attribute: false, requires_manual_verification: true,
        source_confidence: null, source_note: "Added manually by Quality Engineer",
      });
      save(); render();
      break;
    }

    case "approve-standard": {
      const standard = byId("standards", id);
      const params = db.parameters.filter(p => p.standard_id === standard.id);
      if (!params.length) return toast("The standard has no inspection parameters", "bad");
      const unver = params.filter(p => p.requires_manual_verification).map(p => p.seq);
      if (unver.length)
        return toast(`Cannot approve — S.No ${unver.join(", ")} still ` +
          `${unver.length === 1 ? "requires" : "require"} manual verification`, "bad");
      standard.status = "approved";
      standard.approved_by_id = state.user.id;
      standard.approved_at = new Date().toISOString();
      audit("standard.approve", "standard", standard.id);
      save(); render();
      toast(`${standard.code} approved and released for inspection`, "good");
      break;
    }

    case "new-report": newReportModal(Number(id)); break;
    case "do-create-report":
      createReport(Number(id), {
        supplier_id: $("#nrSupplier").value, batch_number: $("#nrBatch").value,
        inspection_date: $("#nrDate").value, po_number: $("#nrPo").value,
        invoice_number: $("#nrInv").value, shift: $("#nrShift").value,
        machine_number: $("#nrMachine").value, operator_name: $("#nrOperator").value,
        lot_quantity: $("#nrLot").value, sample_quantity: $("#nrSample").value,
      });
      closeModal();
      break;

    case "save-results": saveResults(Number(id)); break;
    case "sign": signModal(Number(id)); break;
    case "do-sign": {
      const name = $("#signName").value.trim();
      if (!name) return toast("Enter your name to sign", "bad");
      if (submitReport(Number(id), name)) closeModal();
      break;
    }
    case "qa": qaModal(Number(id)); break;
    case "do-qa": {
      const name = $("#qaName").value.trim();
      if (!name) return toast("Enter your name to sign", "bad");
      qaDecide(Number(id), btn.dataset.decision, {
        signature: name, remarks: $("#qaRemarks").value.trim(),
        accepted: Number($("#qaAccepted").value) || 0,
        rejected: Number($("#qaRejected").value) || 0,
        rework: Number($("#qaRework").value) || 0,
      });
      closeModal();
      break;
    }

    case "export-report": exportReportCsv(Number(id)); break;
    case "export-list": exportReportListCsv(); break;
    case "export-json": exportJson(); break;

    case "save-settings":
      settings.apiKey = $("#setKey").value.trim();
      settings.model = $("#setModel").value;
      settings.threshold = Number($("#setThreshold").value);
      saveSettings(); render();
      toast(settings.apiKey ? "Settings saved — live AI extraction enabled"
                            : "Settings saved — running the offline extractor", "good");
      break;

    case "reset-demo":
      if (!confirm("Discard all data in this browser and rebuild the demo dataset?")) return;
      localStorage.removeItem(DB_KEY);
      seed(); state.drafts = {}; state.draftExtraction = null;
      render(); toast("Demo data rebuilt", "good");
      break;
  }
});

/* ------------------------------------------------------------ form input */
document.addEventListener("change", e => {
  if (e.target.id !== "roleSwitch") return;
  const user = byId("users", e.target.value);
  if (!user) return;
  state.user = user;
  localStorage.setItem(SESSION_KEY, String(user.id));
  state.drafts = {};
  state.draftExtraction = null;
  audit("role.switch", "user", user.id, { role: user.role });
  save();
  const entry = ROUTES.find(x => x[0] === currentRoute().name);
  if (entry && !can(entry[3])) go("#/dashboard"); else render();
  toast(`Acting as ${user.full_name} — ${titleCase(user.role)}`);
});

document.addEventListener("input", e => {
  const el = e.target;

  if (el.id === "globalSearch") {
    state.search = el.value;
    if (currentRoute().name !== "reports") { go("#/reports"); return; }
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(() => { render(); $("#globalSearch")?.focus(); }, 220);
    return;
  }
  if (el.id === "setThreshold") {
    el.previousElementSibling.textContent = `Confidence threshold — ${(Number(el.value) * 100).toFixed(0)}%`;
    return;
  }
  if (["qaAccepted", "qaRejected", "qaRework"].includes(el.id)) {
    qaCheckQuantities(Number($("[data-act='do-qa']").dataset.id));
    return;
  }

  /* list filters — re-render but keep the caret where it was */
  const filterMap = {
    drawingQuery: "drawingQuery", drawingStatus: "drawingStatus",
    standardQuery: "standardQuery", standardStatus: "standardStatus",
  };
  if (filterMap[el.id]) {
    state[filterMap[el.id]] = el.value;
    rerenderKeepingFocus(el.id, el.selectionStart);
    return;
  }
  if (el.id.startsWith("rf")) {
    const f = state.reportFilters;
    if (el.id === "rfQ") { f.q = el.value; state.search = el.value; }
    if (el.id === "rfStatus") f.status = el.value;
    if (el.id === "rfSupplier") f.supplier = el.value;
    if (el.id === "rfFrom") f.from = el.value;
    if (el.id === "rfTo") f.to = el.value;
    rerenderKeepingFocus(el.id, el.selectionStart);
    return;
  }

  /* extraction verification grid — edits go to a draft, never straight to the record */
  if (el.dataset.dim !== undefined || el.dataset.verify !== undefined || el.dataset.header !== undefined) {
    const rev = db.revisions.find(r => r.drawing_id === Number(currentRoute().id) && r.is_current);
    if (!rev?.extraction) return;
    if (!state.draftExtraction) state.draftExtraction = JSON.parse(JSON.stringify(rev.extraction));
    const ex = state.draftExtraction;

    if (el.dataset.header !== undefined) {
      ex[el.dataset.header] = el.value;
      ex.header_requires_verification[el.dataset.header] = el.value.trim() === "";
      return;
    }
    if (el.dataset.verify !== undefined) {
      const d = ex.dimensions[Number(el.dataset.verify)];
      d.requires_manual_verification = !el.checked;
      d.verification_reasons = el.checked ? [] : ["Marked for manual verification by Quality Engineer"];
      rerenderKeepingFocus(null);
      return;
    }
    const d = ex.dimensions[Number(el.dataset.dim)];
    const field = el.dataset.field;
    d[field] = ["nominal_value", "upper_tolerance", "lower_tolerance"].includes(field)
      ? (el.value === "" ? null : Number(el.value)) : el.value;
    return;
  }

  /* inspection-standard grid — writes straight through, saved on Save changes */
  if (el.dataset.param !== undefined) {
    const p = byId("parameters", el.dataset.param);
    const field = el.dataset.field;
    if (field === "is_attribute") { p.is_attribute = el.checked; rerenderKeepingFocus(null); return; }
    if (field === "instrument_id") {
      p.instrument_id = el.value ? Number(el.value) : null;
      p.instrument_text = byId("instruments", p.instrument_id)?.name || p.instrument_text;
      return;
    }
    p[field] = ["nominal_value", "upper_tolerance", "lower_tolerance"].includes(field)
      ? (el.value === "" ? null : Number(el.value)) : el.value;
    if (["nominal_value", "upper_tolerance", "lower_tolerance"].includes(field))
      p.acceptance_criteria = acceptanceText(p);
    return;
  }
  if (el.dataset.clearVerify !== undefined) {
    const p = byId("parameters", el.dataset.clearVerify);
    p.requires_manual_verification = false;
    p.acceptance_criteria = acceptanceText(p);
    save(); render();
    return;
  }

  /* inspection result grid — live preview via drafts */
  if (el.dataset.result !== undefined) {
    const resultId = Number(el.dataset.result);
    const field = el.dataset.field;
    state.drafts = state.drafts || {};
    const draft = state.drafts[resultId] || (state.drafts[resultId] = {});
    if (field === "defect_id") draft.defect_id = el.value ? Number(el.value) : null;
    else draft[field] = el.value;

    if (field === "defect_id" && draft.defect_id)
      draft.defect_description = byId("defects", draft.defect_id)?.name || "";

    /* Only the verdict-changing fields need a repaint. */
    if (field === "readings" || field === "manual_result" || field === "defect_id")
      rerenderKeepingFocus(null, el.selectionStart, el);
  }
});

/** Re-render, then put the caret back so typing in a grid is not interrupted. */
function rerenderKeepingFocus(elementId, caret, sourceEl) {
  const key = sourceEl
    ? `[data-result="${sourceEl.dataset.result}"][data-field="${sourceEl.dataset.field}"]`
    : elementId ? `#${elementId}` : null;
  render();
  if (!key) return;
  const next = $(key);
  if (!next) return;
  next.focus();
  if (caret != null && next.setSelectionRange && next.type !== "number") {
    try { next.setSelectionRange(caret, caret); } catch (err) { /* unsupported input type */ }
  }
}

/* ---------------------------------------------------------------- upload */
function bindDropzone() {
  const zone = $("#dropzone"), input = $("#fileInput");
  if (!zone || !input) return;
  const pick = file => {
    if (!file) return;
    pendingFile = file;
    $("#dropLabel").textContent = `${file.name} — ${fmtBytes(file.size)}`;
    if (!$("#upNumber").value) $("#upNumber").value = file.name.replace(/\.[^.]+$/, "");
  };
  zone.addEventListener("click", () => input.click());
  zone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", () => pick(input.files[0]));
  ["dragenter", "dragover"].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.add("over");
  }));
  ["dragleave", "drop"].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.remove("over");
  }));
  zone.addEventListener("drop", e => pick(e.dataTransfer.files[0]));
}

async function doUpload() {
  const err = $("#uploadError");
  const number = $("#upNumber").value.trim();
  if (!pendingFile) return err.innerHTML = `<div class="note fail">Choose a drawing file first.</div>`;
  if (!number) return err.innerHTML = `<div class="note fail">Enter a drawing number.</div>`;
  if (pendingFile.size > 25 * 1024 * 1024)
    return err.innerHTML = `<div class="note fail">That file is ${fmtBytes(pendingFile.size)} — the limit is 25 MB.</div>`;

  const partNo = $("#upPartNo").value.trim();
  const partName = $("#upPartName").value.trim();
  let part = partNo ? db.parts.find(p => p.part_number === partNo) : null;
  if (partNo && !part) {
    part = { id: nextId("parts"), part_number: partNo, part_name: partName || partNo,
             material: null, customer_name: null, supplier_id: null };
    db.parts.push(part);
  }

  const drawing = {
    id: nextId("drawings"), drawing_number: number, title: $("#upTitle").value.trim() || null,
    part_id: part ? part.id : null, file_name: pendingFile.name,
    mime_type: pendingFile.type || "application/octet-stream", file_size: pendingFile.size,
    status: "uploaded", uploaded_by_id: state.user.id, created_at: new Date().toISOString(),
  };
  db.drawings.push(drawing);
  db.revisions.push({
    id: nextId("revisions"), drawing_id: drawing.id, revision: $("#upRev").value.trim() || "-",
    is_current: true, status: "uploaded", extraction: null, extraction_confidence: null,
    extraction_engine: null, extraction_error: null, analyzed_at: null,
    verified_by_id: null, verified_at: null, created_at: new Date().toISOString(),
  });

  state.files = state.files || new Map();
  state.files.set(drawing.id, pendingFile);
  blobs.set(drawing.id, URL.createObjectURL(pendingFile));

  const analyze = $("#upAnalyze").checked;
  audit("drawing.upload", "drawing", drawing.id, { file: pendingFile.name });
  save();
  pendingFile = null;
  closeModal();
  go(`#/drawings/${drawing.id}`);
  if (analyze) setTimeout(() => runAnalysis(drawing.id), 60);
}

/* ------------------------------------------------------------------ boot */
window.addEventListener("hashchange", () => {
  state.drafts = {};
  state.draftExtraction = null;
  state.railOpen = false;
  render();
  window.scrollTo(0, 0);
});

/* Modal DOM is created after render, so bind the dropzone when it appears. */
new MutationObserver(() => { if ($("#dropzone")) bindDropzone(); })
  .observe(document.body, { childList: true });

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

(function boot() {
  const theme = localStorage.getItem("qip.theme");
  if (theme) document.documentElement.setAttribute("data-theme", theme);
  try { settings = { ...settings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; } catch (e) { /* defaults */ }

  loadDb();
  // No sign-in gate: open straight into the workspace. The rail's "Acting as"
  // switcher changes role, so RBAC is still exercised without a login wall.
  state.user = byId("users", localStorage.getItem(SESSION_KEY))
    || db.users.find(u => u.role === "admin")
    || db.users[0];
  state.drafts = {};
  if (!location.hash) location.hash = "#/dashboard";
  render();
})();
</script>
