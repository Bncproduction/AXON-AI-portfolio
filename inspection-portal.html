        <select class="in" style="width:140px;padding:5px 9px" id="drawingStatus">
          ${["", "uploaded", "analyzing", "analyzed", "failed"].map(v =>
            `<option value="${v}" ${v === filter ? "selected" : ""}>${v ? titleCase(v) : "All statuses"}</option>`).join("")}
        </select>`,
    });
}

function drawingDetailView(id) {
  const drawing = byId("drawings", id);
  if (!drawing) return `<div class="note fail">Drawing not found.</div>`;
  const rev = db.revisions.find(r => r.drawing_id === drawing.id && r.is_current)
           || db.revisions.filter(r => r.drawing_id === drawing.id).pop();
  const ex = state.draftExtraction || rev?.extraction || null;
  const part = byId("parts", drawing.part_id);
  const unverified = ex ? ex.dimensions.filter(d => d.requires_manual_verification).length : 0;
  const editable = can("quality_manager");

  const notices = [];
  if (rev?.extraction_error) notices.push(`<div class="note fail">Last analysis failed: ${esc(rev.extraction_error)}</div>`);
  if (ex && unverified) notices.push(`<div class="note warn">
    <b>${unverified}</b> characteristic${unverified === 1 ? "" : "s"} could not be read confidently and
    ${unverified === 1 ? "is" : "are"} held as <em>Requires Manual Verification</em>. Supply the value from
    the drawing and tick Verified — the standard cannot be approved until every row is cleared.</div>`);
  if (ex && !unverified && ex.dimensions.length) notices.push(`<div class="note pass">
    All ${ex.dimensions.length} characteristics verified. Ready to generate the inspection standard.</div>`);
  if (ex && ex.ballooned) notices.push(`<div class="note pass">
    This drawing is ballooned, so only the ${ex.dimensions.length} ballooned characteristics were
    extracted. Unballooned dimensions, general-tolerance tables and notes are deliberately left out.</div>`);

  // A scan either has no text layer at all, or an OCR one too garbled to parse.
  // Both look the same to the user, so say the same clear thing about both.
  const HEADER_FIELDS_READ = ["part_name", "part_number", "drawing_number", "drawing_revision", "material"];
  const readCount = ex ? HEADER_FIELDS_READ.filter(f => ex[f]).length : 0;
  const offlineEngine = rev?.extraction_engine === "offline-scanned"
    || rev?.extraction_engine === "offline-stub"
    || (rev?.extraction_engine === "pdf-text-layer" && readCount <= 1);

  if (!settings.apiKey && rev?.extraction && offlineEngine) notices.push(`<div class="note warn">
    <b>Almost nothing could be read from this sheet, because no AI key is configured.</b>
    It is a scan — a picture of a drawing. There is no reliable text to parse and no way to see the
    balloons without AI vision. Add an Anthropic key under <b>Settings</b> and run the analysis again;
    it will then fill the title block and pull out the ballooned characteristics. Until then, type the
    values in below by hand — the rows are editable.</div>`);
  else if (!settings.apiKey) notices.push(`<div class="note info">
    No AI key configured. <b>Run AI analysis</b> reads the title block out of the PDF's own text layer,
    which is why some fields below are filled — but it cannot see the views, so
    <b>dimensions, tolerances and balloons</b> are not extracted. Add a key under Settings for that.</div>`);

  // Filled in by hydrateSheets() once the stored file has been read back.
  const preview = `<div class="preview" style="overflow:auto" data-sheet="${drawing.id}"
      data-number="${esc(drawing.drawing_number)}" data-mime="${esc(drawing.mime_type)}">
      <div class="empty" style="padding:28px 18px">Loading sheet…</div></div>`;

  const headerFields = [
    ["part_name", "Part name"], ["part_number", "Part number"], ["drawing_number", "Drawing number"],
    ["drawing_revision", "Revision"], ["material", "Material"], ["units", "Units"],
  ];

  return pageHead(drawing.drawing_number,
    `${esc(drawing.title || "Untitled sheet")} · Rev ${esc(rev?.revision || "—")} ${chip(drawing.status)}
     ${rev?.extraction_engine ? `<span class="chip info">${esc(rev.extraction_engine)}</span>` : ""}
     ${part ? `<span class="mono" style="font-size:12px;color:var(--ink-3)">${esc(part.part_number)}</span>` : ""}`,
    `<a class="btn" href="#/drawings">Back</a>
     ${can("inspector") ? `<button class="btn" data-act="analyze" data-id="${drawing.id}">
        ${rev?.extraction ? "Re-run AI analysis" : "Run AI analysis"}</button>` : ""}
     ${editable && ex ? `<button class="btn" data-act="save-extraction" data-rev="${rev.id}">Save verification</button>
        <button class="btn primary" data-act="gen-standard" data-rev="${rev.id}">Generate standard</button>` : ""}
     ${can("quality_manager")
        ? `<button class="btn danger" data-act="ask-delete-drawing" data-id="${drawing.id}">Delete drawing</button>` : ""}`) +

  (notices.length ? `<div class="stack" style="margin-bottom:16px">${notices.join("")}</div>` : "") + `

  <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,3fr);margin-bottom:16px" id="drawRow">
    ${card("Drawing sheet", preview, { pad: false })}
    <div class="stack">
      ${card("Title block — extracted", !ex
        ? emptyState("Not analysed yet", "Run the AI analysis to read dimensions, tolerances and GD&T from this sheet.")
        : `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
            ${headerFields.map(([key, label]) => {
              const flagged = ex.header_requires_verification?.[key];
              return `<label class="f"><span class="lbl">${esc(label)}</span>
                <input class="in ${flagged ? "bad" : ""}" data-header="${key}" value="${esc(ex[key] || "")}"
                  placeholder="${flagged ? "Requires verification" : ""}" ${editable ? "" : "disabled"}></label>`;
            }).join("")}
          </div>
          <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:14px;
               border-top:1px solid var(--line);padding-top:12px">
            <div><div class="lbl">General tolerance note</div>
              <div style="margin-top:2px">${ex.general_tolerance_note
                ? esc(ex.general_tolerance_note)
                : `<span style="color:var(--warn)">Not legible — verify manually</span>`}</div></div>
            <div><div class="lbl">Extraction confidence</div>
              <div style="margin-top:2px" class="num">${(ex.overall_confidence * 100).toFixed(0)}% mean across
                ${ex.dimensions.length} characteristics · threshold ${(ex.confidence_threshold * 100).toFixed(0)}%</div></div>
            ${ex.unreadable_areas?.length ? `<div style="grid-column:1/-1"><div class="lbl">Reported unreadable</div>
              <div style="margin-top:2px;color:var(--warn)">${esc(ex.unreadable_areas.join(" · "))}</div></div>` : ""}
            ${ex.notes?.length ? `<div style="grid-column:1/-1"><div class="lbl">Drawing notes</div>
              <div style="margin-top:4px;display:grid;gap:4px">${ex.notes.map(n =>
                `<div>${n.is_inspection_requirement ? `<span class="chip info">Inspection</span> ` : ""}${esc(n.text)}</div>`
              ).join("")}</div></div>` : ""}

/* ============================================================== deletion
   Quality records are not casually disposable: anything a QA manager has
   signed off is kept. Deletion is allowed for work in progress — uploads that
   went nowhere, draft standards, unsubmitted reports — and refused once a
   report has been submitted or closed, which is the point the record becomes
   evidence. Everything removed is written to the audit log first.
   ======================================================================== */
const CLOSED_STATES = new Set(["submitted", "approved", "rejected"]);

/** What would go if this drawing were removed, and whether that is allowed. */
function drawingCascade(drawingId) {
  const revisions = db.revisions.filter(r => r.drawing_id === drawingId);
  const revIds = new Set(revisions.map(r => r.id));
  const standards = db.standards.filter(s => revIds.has(s.drawing_revision_id));
  const stdIds = new Set(standards.map(s => s.id));
  const parameters = db.parameters.filter(p => stdIds.has(p.standard_id));
  const reports = db.reports.filter(r => stdIds.has(r.standard_id) || r.drawing_id === drawingId);
  const reportIds = new Set(reports.map(r => r.id));
  const results = db.results.filter(r => reportIds.has(r.report_id));
  const locked = reports.filter(r => CLOSED_STATES.has(r.status));
  return { revisions, standards, parameters, reports, results, locked };
}

function deleteDrawing(drawingId) {
  const drawing = byId("drawings", drawingId);
  if (!drawing) return;
  const c = drawingCascade(drawingId);
  if (c.locked.length) {
    return toast(`Cannot delete — ${c.locked.length} inspection report(s) have been submitted ` +
      `or closed against this drawing. Those are quality records.`, "bad");
  }

  const revIds = new Set(c.revisions.map(r => r.id));
  const stdIds = new Set(c.standards.map(s => s.id));
  const reportIds = new Set(c.reports.map(r => r.id));

  audit("drawing.delete", "drawing", drawingId, {
    drawing_number: drawing.drawing_number, revisions: c.revisions.length,
    standards: c.standards.length, parameters: c.parameters.length, reports: c.reports.length,
  });

  db.results = db.results.filter(r => !reportIds.has(r.report_id));
  db.reports = db.reports.filter(r => !reportIds.has(r.id));
  db.parameters = db.parameters.filter(p => !stdIds.has(p.standard_id));
  db.standards = db.standards.filter(s => !stdIds.has(s.id));
  db.revisions = db.revisions.filter(r => !revIds.has(r.id));
  db.drawings = db.drawings.filter(d => d.id !== drawingId);

  const url = blobs.get(drawingId);
  if (url) { URL.revokeObjectURL(url); blobs.delete(drawingId); }
  state.files?.delete(drawingId);
  deleteSheet(drawingId);
  state.draftExtraction = null;
  state.drafts = {};

  save();
  go("#/drawings");
  render();
  toast(`Deleted ${drawing.drawing_number}`, "good");
}

function deleteStandard(standardId) {
  const s = byId("standards", standardId);
  if (!s) return;
  const reports = db.reports.filter(r => r.standard_id === standardId);
  const locked = reports.filter(r => CLOSED_STATES.has(r.status));
  if (locked.length)
    return toast(`Cannot delete — ${locked.length} report(s) submitted or closed against this standard.`, "bad");

  const reportIds = new Set(reports.map(r => r.id));
  audit("standard.delete", "standard", standardId, { code: s.code, reports: reports.length });
  db.results = db.results.filter(r => !reportIds.has(r.report_id));
  db.reports = db.reports.filter(r => !reportIds.has(r.id));
  db.parameters = db.parameters.filter(p => p.standard_id !== standardId);
  db.standards = db.standards.filter(x => x.id !== standardId);
  save();
  go("#/standards");
  render();
  toast(`Deleted ${s.code}`, "good");
}

function deleteReport(reportId) {
  const r = byId("reports", reportId);
  if (!r) return;
  if (CLOSED_STATES.has(r.status))
    return toast("Cannot delete — this report has been submitted or closed. It is a quality record.", "bad");
  audit("report.delete", "report", reportId, { report_number: r.report_number });
  db.results = db.results.filter(x => x.report_id !== reportId);
  db.reports = db.reports.filter(x => x.id !== reportId);
  state.drafts = {};
  save();
  go("#/reports");
  render();
  toast(`Deleted ${r.report_number}`, "good");
}

/** Confirmation that spells out exactly what disappears. */
function confirmDeleteDrawing(drawingId) {
  const drawing = byId("drawings", drawingId);
  const c = drawingCascade(drawingId);
  const lines = [
    ["Drawing revisions", c.revisions.length],
    ["Inspection standards", c.standards.length],
    ["Inspection parameters", c.parameters.length],
    ["Inspection reports", c.reports.length],
    ["Recorded results", c.results.length],
  ].filter(([, n]) => n > 0);

  openModal(`Delete ${drawing.drawing_number}?`, `
    ${c.locked.length ? `<div class="note fail" style="margin-bottom:12px">
        <b>${c.locked.length} inspection report(s)</b> against this drawing have been submitted or
        closed. Those are quality records and cannot be deleted — archive the standard instead.</div>`
      : `<div class="note warn" style="margin-bottom:12px">This cannot be undone.</div>`}
    <p style="font-size:13.5px;color:var(--ink-2)">Removing
      <b>${esc(drawing.drawing_number)}</b> — ${esc(drawing.file_name)} — also removes:</p>
    <ul style="margin:10px 0 0;padding-left:18px;font-size:13.5px">
      ${lines.length ? lines.map(([label, n]) => `<li>${n} × ${esc(label.toLowerCase())}</li>`).join("")
                     : `<li>nothing else — no standard has been generated from it</li>`}
    </ul>`,
    `<button class="btn" data-act="close-modal">Cancel</button>
     ${c.locked.length ? "" :
       `<button class="btn danger" data-act="do-delete-drawing" data-id="${drawingId}">Delete permanently</button>`}`);
}

/* ------------------------------------------------------- drawing actions */
async function runAnalysis(drawingId) {
  const drawing = byId("drawings", drawingId);
  const rev = db.revisions.find(r => r.drawing_id === drawing.id && r.is_current);
  if (!rev) return toast("This drawing has no current revision", "bad");
  const ext = (drawing.file_name || "").toLowerCase().split(".").pop();
  if (ext === "dwg" || ext === "dxf")
    return toast("Native CAD must be exported to PDF before AI analysis", "bad");

  drawing.status = rev.status = "analyzing"; save(); render();
  toast("Reading the drawing…");

  try {
    // Reads the stored sheet, so re-analysis works after a reload too.
    const file = await sheetFile(drawing.id);
    let extraction;
    if (settings.apiKey && file) {
      extraction = await extractWithAI(file);
    } else if (settings.apiKey && !file) {
      throw new Error("The original file is no longer in this session — re-upload it to analyse");
    } else if (file && drawing.mime_type === "application/pdf") {
      // No AI key: read whatever the PDF's own text layer gives us.
      const text = await pdfText(file);
      extraction = text
        ? extractionFromText(text, drawing.file_name)
        : offlineExtraction(drawing.file_name, "scanned");
    } else {
      extraction = offlineExtraction(drawing.file_name);
    }
    rev.extraction = extraction;
    rev.extraction_confidence = extraction.overall_confidence;
    rev.extraction_engine = extraction.engine;
    rev.extraction_error = null;
    rev.analyzed_at = new Date().toISOString();
    rev.status = drawing.status = "analyzed";
    if (extraction.drawing_revision && (rev.revision === "-" || !rev.revision))
      rev.revision = String(extraction.drawing_revision).slice(0, 20);
    const part = byId("parts", drawing.part_id);
    if (part && extraction.material && !part.material) part.material = extraction.material;

    state.draftExtraction = null;
    audit("drawing.analyze", "drawing_revision", rev.id,
      { engine: extraction.engine, characteristics: extraction.dimensions.length });
    save(); render();
    const unver = extraction.dimensions.filter(d => d.requires_manual_verification).length;
    toast(unver ? `Analysis complete — ${unver} characteristic(s) need manual verification`
                : "Analysis complete — all characteristics read confidently", unver ? "" : "good");
  } catch (err) {
    drawing.status = rev.status = "failed";
    rev.extraction_error = err.message;
    audit("drawing.analyze.failed", "drawing", drawing.id, { error: err.message });
    save(); render();
    toast(err.message, "bad");
  }
}

function generateStandard(revId) {
  const rev = byId("revisions", revId);
  const extraction = state.draftExtraction || rev.extraction;
  if (!extraction) return toast("Run the AI analysis first", "bad");
  persistExtraction(revId, { silent: true });

  const drawing = byId("drawings", rev.drawing_id);
  const version = db.standards.filter(s => s.drawing_revision_id === rev.id).length + 1;
  const standard = {
    id: nextId("standards"),
    code: `IS-${drawing.drawing_number}-${rev.revision}-v${version}`.replace(/\s+/g, ""),
    title: `Inspection Standard — ${drawing.title || drawing.drawing_number} (Rev ${rev.revision})`,
    drawing_revision_id: rev.id, part_id: drawing.part_id, version,
    status: "draft", notes: null,
    created_by_id: state.user.id, approved_by_id: null, approved_at: null,
    created_at: new Date().toISOString(),
  };
  db.standards.push(standard);
  buildParameters(extraction).forEach(p =>
    db.parameters.push({ id: nextId("parameters"), standard_id: standard.id, ...p }));

  audit("standard.generate", "standard", standard.id, { version });
  state.draftExtraction = null;
  save();
  toast(`Generated ${standard.code}`, "good");
  go(`#/standards/${standard.id}/edit`);   // straight into review, before it is released
}

function persistExtraction(revId, opts = {}) {
  const rev = byId("revisions", revId);
  if (!rev || !state.draftExtraction) { if (!opts.silent) toast("Nothing to save"); return; }
  rev.extraction = state.draftExtraction;
  rev.extraction_confidence = state.draftExtraction.overall_confidence;
  rev.verified_by_id = state.user.id;
  rev.verified_at = new Date().toISOString();
  audit("extraction.verify", "drawing_revision", rev.id);
  state.draftExtraction = null;
  save();
  if (!opts.silent) { render(); toast("Verified extraction saved", "good"); }
}

            ? `<div style="margin-top:3px"><span class="chip fail">Calibration overdue</span></div>` : ""}</td>
        <td><input class="in cell" list="frequencyOptions" data-param="${p.id}" data-field="frequency"

        <td><select class="in cell" data-param="${p.id}" data-field="classification" ${editable ? "" : "disabled"}>
          ${["critical", "major", "minor"].map(c => `<option value="${c}" ${c === p.classification ? "selected" : ""}>${titleCase(c)}</option>`).join("")}
        </select></td>
        <td><input class="in cell" data-param="${p.id}" data-field="reference_dimension" value="${esc(p.reference_dimension || "")}" ${editable ? "" : "disabled"}></td>
        <td><input class="in cell" data-param="${p.id}" data-field="remarks" value="${esc(p.remarks || "")}" ${editable ? "" : "disabled"}>
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;margin-top:4px;
                 color:${p.requires_manual_verification ? "var(--warn)" : "var(--ink-3)"}"
                 title="Tick to hold this parameter for manual verification; untick once you have confirmed the value against the drawing">
            <input type="checkbox" data-verify-param="${p.id}"

          </label></td>
        <td class="r">${editable
          ? `<button class="btn sm" data-act="delete-param" data-id="${p.id}"
               title="Remove this characteristic from the standard">✕</button>`
          : ""}</td>
      </tr>`).join("")}</tbody></table></div>`, { pad: false });
}

/* Pick-lists for the standard grid. These are datalists rather than selects so
   a Quality Engineer can choose a common value or type one that is not listed. */
const UNIT_OPTIONS = ["mm", "°", "µm", "inch", "g", "kg", "HRC", "HV", "N", "Nm", "NA"];
const METHOD_OPTIONS = [
  "Variable measurement",
  "Attribute gauging (Go/No-Go)",
  "Optical comparison",
  "Optical comparison against drawing",
  "Angular measurement",
  "Bore measurement",
  "Surface roughness test",
  "Coordinate measurement (CMM)",
  "Visual inspection",
  "Visual inspection / document check",
  "Hardness test",
  "Weight check",
  "Functional / assembly check",
];
const FREQUENCY_OPTIONS = [
  "100% inspection", "Every incoming lot", "First article + last piece",
  "Once per lot", "Once per shift", "2 pcs per lot", "5 pcs per lot", "Hourly",
];

function pickLists() {
  const list = (id, values) =>
    `<datalist id="${id}">${values.map(v => `<option value="${esc(v)}"></option>`).join("")}</datalist>`;
  return list("unitOptions", UNIT_OPTIONS) +
         list("methodOptions", METHOD_OPTIONS) +
         list("frequencyOptions", FREQUENCY_OPTIONS) +
         list("samplingOptions", [IS2500, IS2500_FULL, "100% — no sampling permitted",
           "ISO 2859-1, Level II, AQL 0.65", "ISO 2859-1, Level II, AQL 1.5", "1 pc per lot"]);
}

/* ------------------------------------ BNC-format controlled standard sheet */
const CTQ_MARK = { critical: "●", major: "◐", minor: "" };

function standardDocView(id) {

  const isAppearance = p => (p.characteristic_type || (p.is_attribute ? "appearance" : "dimensional")) === "appearance";
  const appearance = params.filter(isAppearance);
  const dimensional = params.filter(p => !isAppearance(p));
  const part = byId("parts", s.part_id);

  const head = (rows, offset) => rows.map((p, i) => `<tr>

    <table style="margin-bottom:-1px">

      <tr><td class="c">NR</td><td>New Release</td><td class="c">22.06.2024</td></tr>
    </table>
    <table>
      <tr><td class="sig" style="width:50%">PREPARED BY:</td><td class="sig">APPROVED BY:</td></tr>

}

/* ================================================================ reports */
function reportsView() {
  const f = state.reportFilters || (state.reportFilters = { q: "", status: "", supplier: "", from: "", to: "" });
  const q = (state.search || f.q || "").toLowerCase();
  const rows = db.reports.filter(r =>
    (!q || [r.report_number, r.batch_number, r.po_number, r.invoice_number]
      .some(v => (v || "").toLowerCase().includes(q))) &&
    (!f.status || r.status === f.status) &&
    (!f.supplier || r.supplier_id === Number(f.supplier)) &&
    (!f.from || (r.inspection_date || "") >= f.from) &&
    (!f.to || (r.inspection_date || "") <= f.to)
  ).sort((a, b) => (b.inspection_date || "").localeCompare(a.inspection_date || "") || b.id - a.id);

  const filters = card("Filters", `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <label class="f"><span class="lbl">Search</span>
      <input class="in" id="rfQ" value="${esc(state.search || f.q)}" placeholder="Report / batch / PO / invoice"></label>
    <label class="f"><span class="lbl">Status</span>
      <select class="in" id="rfStatus">${["", "draft", "submitted", "approved", "rejected"].map(v =>
        `<option value="${v}" ${v === f.status ? "selected" : ""}>${v ? titleCase(v) : "All"}</option>`).join("")}</select></label>
    <label class="f"><span class="lbl">Supplier</span>
      <select class="in" id="rfSupplier"><option value="">All</option>${db.suppliers.map(s =>
        `<option value="${s.id}" ${String(s.id) === f.supplier ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>
    <label class="f"><span class="lbl">From</span><input class="in" type="date" id="rfFrom" value="${esc(f.from)}"></label>
    <label class="f"><span class="lbl">To</span><input class="in" type="date" id="rfTo" value="${esc(f.to)}"></label>
  </div>`);

  const body = rows.length ? `<div class="tablewrap"><table>
    <thead><tr><th>Report no.</th><th>Part</th><th>Supplier</th><th>Batch</th><th>PO</th><th>Date</th>
      <th>Shift</th><th>Inspector</th><th class="r">Checked</th><th class="r">Failed</th>
      <th class="r">Critical</th><th>Result</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.critical_failures ? "row-fail" : ""}">
      <td><a href="#/reports/${r.id}" class="mono">${esc(r.report_number)}</a></td>
      <td class="mono" style="font-size:12px">${esc(byId("parts", r.part_id)?.part_number || "—")}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(byId("suppliers", r.supplier_id)?.name || "—")}</td>
      <td class="mono" style="font-size:12px">${esc(r.batch_number || "—")}</td>
      <td class="mono" style="font-size:12px">${esc(r.po_number || "—")}</td>
      <td>${fmtDate(r.inspection_date)}</td><td>${esc(r.shift || "—")}</td>
      <td>${esc(r.inspector_name || "—")}</td>
      <td class="r num">${r.total_parameters}</td>
      <td class="r num">${r.failed_parameters ? `<b style="color:var(--fail)">${r.failed_parameters}</b>` : "0"}</td>
      <td class="r num">${r.critical_failures ? `<b style="color:var(--fail)">${r.critical_failures}</b>` : "0"}</td>
      <td>${chip(r.overall_result)}</td><td>${chip(r.status)}</td>
      <td class="r" style="white-space:nowrap">
        <a class="btn sm" href="#/reports/${r.id}">Open</a>
        ${can("quality_manager") && r.status === "draft"
          ? `<button class="btn sm" data-act="delete-report" data-id="${r.id}"
               title="Delete this draft report" style="margin-left:4px">Delete</button>` : ""}
      </td></tr>`).join("")}</tbody></table></div>`
    : emptyState("No reports match these filters", "Approve an inspection standard, then create a report against it.");

  return pageHead("Inspection Reports", "Search by report number, batch, PO, invoice, supplier or date",
      `<button class="btn" data-act="export-list">Export CSV</button>`) +
    `<div style="margin-bottom:16px">${filters}</div>` +
    card(`${rows.length} report${rows.length === 1 ? "" : "s"}`, body, { pad: false });
}

/* -------------------------------------------------------- report detail */
function reportRows(report) {
  return db.results.filter(r => r.report_id === report.id)
    .sort((a, b) => a.seq - b.seq)
    .map(row => {
      const p = byId("parameters", row.parameter_id);
      const draft = state.drafts?.[row.id];
      const readings = draft && "readings" in draft ? draft.readings : (row.readings ?? "");
      const manual = draft && "manual_result" in draft
        ? draft.manual_result
        : (p.is_attribute && row.result !== PENDING ? row.result : null);
      return { row, p, draft, readings, manual, verdict: evaluateSample(p, readings, manual) };
    });
}

function reportDetailView(id) {
  const report = byId("reports", id);
  if (!report) return `<div class="note fail">Inspection report not found.</div>`;
  const rows = reportRows(report);
  const part = byId("parts", report.part_id);
  const drawing = byId("drawings", report.drawing_id);
  const supplier = byId("suppliers", report.supplier_id);
  const openForEdit = (report.status === "draft" || report.status === "submitted") && can("inspector");
  const live = summarise(rows.map(r => ({ result: r.verdict.result, classification: r.p.classification })));
  const dirty = !!state.drafts && Object.keys(state.drafts).length > 0;
  const sampleQty = report.sample_quantity || 0;

  const notices = [];
  if (dirty) notices.push(`<div class="note warn">Unsaved measurements. The verdicts below are a live preview —
    save to record them and update the summary.</div>`);
  if (live.pending && openForEdit) notices.push(`<div class="note info">${live.pending} parameter${
    live.pending === 1 ? "" : "s"} awaiting a result. The report cannot be submitted until every row is judged.</div>`);
  if (report.critical_failures) notices.push(`<div class="note fail"><b>${report.critical_failures}</b>
    critical characteristic${report.critical_failures === 1 ? "" : "s"} out of tolerance — this lot cannot ship on this report.</div>`);

  return pageHead(report.report_number,
    `${esc(part?.part_name || "—")} · ${esc(part?.part_number || "—")} · Drawing
     ${esc(drawing?.drawing_number || "—")} Rev ${esc(report.drawing_revision || "—")}
     ${chip(report.status)} ${chip(report.overall_result)}`,
    `<a class="btn" href="#/reports">Back</a>
     <a class="btn" href="#/reports/${report.id}/doc">Controlled document</a>
     <button class="btn" data-act="export-report" data-id="${report.id}">Export CSV</button>
     ${openForEdit ? `<button class="btn primary" data-act="save-results" data-id="${report.id}">
        ${dirty ? "Save results" : "Re-evaluate"}</button>` : ""}
     ${openForEdit && report.status === "draft"
        ? `<button class="btn primary" data-act="sign" data-id="${report.id}">Sign &amp; submit</button>` : ""}
     ${report.status === "submitted" && can("quality_manager")
        ? `<button class="btn primary" data-act="qa" data-id="${report.id}">QA decision</button>` : ""}`) +

  (notices.length ? `<div class="stack no-print" style="margin-bottom:16px">${notices.join("")}</div>` : "") +

  `<div style="margin-bottom:16px">${titleBlock([
    ["Company name", report.company_name], ["Supplier name", supplier?.name],
    ["Customer name", report.customer_name], ["Part name", part?.part_name],
    ["Part number", part?.part_number, true],
    ["Drawing number", drawing?.drawing_number, true], ["Drawing revision", report.drawing_revision],
    ["Batch / lot number", report.batch_number, true], ["PO number", report.po_number, true],
    ["Invoice number", report.invoice_number, true],
    ["Inspection date", fmtDate(report.inspection_date)], ["Shift", report.shift],
    ["Machine number", report.machine_number], ["Operator name", report.operator_name],
    ["Inspector name", report.inspector_name],
  ])}</div>` +

  card("Inspection results", `<div class="tablewrap wide-report" data-cols="report"><table>
    <thead><tr><th style="width:44px">S.No</th><th style="min-width:170px">Inspection parameter</th>
      <th style="min-width:130px">Specification</th><th style="width:96px">Tolerance</th>
      <th style="width:120px">Limits</th><th style="min-width:120px">Method</th>
      <th style="min-width:140px">Instrument</th>
      <th style="width:150px">Actual readings${sampleQty ? ` (${sampleQty} pcs)` : ""}</th>
      <th class="r" style="width:74px">Min</th><th class="r" style="width:74px">Max</th>
      <th style="width:96px">Result</th><th class="r" style="width:88px">Deviation</th>
      <th style="min-width:150px">Defect description</th><th style="min-width:140px">Inspector remarks</th></tr></thead>
    <tbody>${rows.map(({ row, p, draft, readings, manual, verdict }) => {
      const failing = verdict.result === FAIL;
      const d = draft || {};
      const defectId = "defect_id" in d ? d.defect_id : row.defect_id;
      const defectText = "defect_description" in d ? d.defect_description : row.defect_description;
      const remarks = "remarks" in d ? d.remarks : row.remarks;
      return `<tr class="${failing ? "row-fail" : verdict.result === PENDING ? "row-warn" : ""}">
        <td class="sev ${esc(p.classification)} num" style="color:var(--ink-3)">${row.seq}</td>
        <td><div style="font-weight:500">${esc(p.parameter)}</div>
          <div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">${chip(p.classification)}

        <td class="mono" style="font-size:12px">${esc(p.specification || "—")}</td>
        <td class="mono" style="font-size:12px">${esc(tolText(p))}</td>
        <td class="mono" style="font-size:11.5px;color:var(--ink-3)">${esc(limitsText(p))}</td>
        <td style="font-size:12px">${esc(p.inspection_method || "—")}</td>
        <td style="font-size:12px">${esc(byId("instruments", p.instrument_id)?.name || p.instrument_text || "—")}</td>
        <td>${p.is_attribute
          ? `<select class="in cell" data-result="${row.id}" data-field="manual_result" ${openForEdit ? "" : "disabled"}>
              <option value="">—</option>
              ${[[PASS, "Conforms"], [FAIL, "Does not conform"], [NA, "Not applicable"]].map(([v, l]) =>
                `<option value="${v}" ${manual === v ? "selected" : ""}>${l}</option>`).join("")}</select>`
          : `<input class="in cell mono ${failing ? "bad" : ""}" data-result="${row.id}"
              data-field="readings" value="${esc(readings ?? "")}"
              placeholder="${p.requires_manual_verification ? "spec unverified" : "20.07, 20.11, 20.06"}"
              title="One reading per piece, separated by commas or spaces"
              ${openForEdit && !p.requires_manual_verification ? "" : "disabled"}>`}</td>
        <td class="r mono num" style="font-size:12px">${verdict.min === null ? "—" : num(verdict.min)}</td>
        <td class="r mono num" style="font-size:12px">${verdict.max === null ? "—" : num(verdict.max)}</td>
        <td>${chip(verdict.result)}${verdict.result === PENDING
          ? `<div style="font-size:11px;color:var(--ink-3);margin-top:3px">${esc(verdict.reason)}</div>` : ""}</td>
        <td class="r mono num" style="font-size:12px">${verdict.deviation
          ? `<b style="color:var(--fail)">${verdict.deviation > 0 ? "+" : ""}${num(verdict.deviation)}</b>` : "—"}</td>
        <td>${failing ? `
          <select class="in cell" data-result="${row.id}" data-field="defect_id" ${openForEdit ? "" : "disabled"}>
            <option value="">— select defect —</option>
            ${db.defects.map(x => `<option value="${x.id}" ${x.id === defectId ? "selected" : ""}>${esc(x.name)}</option>`).join("")}
          </select>
          <input class="in cell" style="margin-top:3px" placeholder="Description" data-result="${row.id}"
            data-field="defect_description" value="${esc(defectText || "")}" ${openForEdit ? "" : "disabled"}>`
          : `<span style="color:var(--ink-3);font-size:12px">—</span>`}</td>
        <td><input class="in cell" data-result="${row.id}" data-field="remarks" value="${esc(remarks || "")}" ${openForEdit ? "" : "disabled"}></td>
      </tr>`;
    }).join("")}</tbody></table></div>`,
    { pad: false, actions: `<span style="font-size:11.5px;color:var(--ink-3)" class="no-print">
        Live: ${live.passed} pass · ${live.failed} fail · ${live.pending} pending</span>` }) +

  `<h2 class="lbl" style="margin:20px 0 10px;font-size:12px">Final inspection summary</h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:16px">
    ${kpi("Total parameters checked", report.total_parameters)}
    ${kpi("Passed parameters", report.passed_parameters, null, "pass")}
    ${kpi("Failed parameters", report.failed_parameters, null, report.failed_parameters ? "fail" : null)}
    ${kpi("Critical failures", report.critical_failures,

/**
 * Remove one characteristic from a standard. Results already recorded against
 * it go too, so nothing is orphaned — but only from reports still in draft. A
 * submitted or closed report is evidence and blocks the deletion outright.
 */
function deleteParameter(parameterId) {
  const p = byId("parameters", parameterId);
  if (!p) return;
  const s = byId("standards", p.standard_id);
  if (!can("quality_manager") || !s || s.status !== "draft") {
    return toast("The standard must be unlocked as a draft before parameters can be removed.", "bad");
  }

  const rows = db.results.filter(r => r.parameter_id === parameterId);
  const reportIds = [...new Set(rows.map(r => r.report_id))];
  const locked = reportIds.map(id => byId("reports", id))
    .filter(r => r && CLOSED_STATES.has(r.status));
  if (locked.length) {
    return toast(`Cannot remove — ${locked.length} submitted or closed report(s) recorded a result ` +
      `against "${p.parameter}". Those are quality records.`, "bad");
  }

  audit("parameter.delete", "standard", s.id,
    { parameter: p.parameter, seq: p.seq, results_removed: rows.length });

  db.results = db.results.filter(r => r.parameter_id !== parameterId);
  db.parameters = db.parameters.filter(x => x.id !== parameterId);

  // Close the gap the deletion leaves in the numbering, on the standard and
  // on every draft report that was built from it.
  db.parameters.filter(x => x.standard_id === s.id)
    .sort((a, b) => a.seq - b.seq)
    .forEach((x, i) => { x.seq = i + 1; });
  reportIds.forEach(id => {
    const report = byId("reports", id);
    if (!report) return;
    db.results.filter(r => r.report_id === id)
      .sort((a, b) => a.seq - b.seq)
      .forEach((r, i) => { r.seq = i + 1; });
    recalcReport(report);
  });

  save();
  render();
  toast(`Removed "${p.parameter}"${rows.length ? ` and ${rows.length} recorded result(s)` : ""}`, "good");
}

/** Add an instrument to the master if that code is not already there. */
function ensureInstrument(code, name, type, leastCount, range) {
  const existing = db.instruments.find(i => i.code === code);
  if (existing) return existing;
  const due = new Date();
  due.setDate(due.getDate() + 180);
  const instrument = {
    id: nextId("instruments"), code, name, type,
    least_count: leastCount, range_text: range,
    calibration_due: due.toISOString().slice(0, 10), is_active: true,
  };
  db.instruments.push(instrument);
  return instrument;
}

/** Withdraw a standard's approval so every parameter becomes editable again. */
function unlockStandard(standardId) {
  const s = byId("standards", standardId);
  if (!s || s.status === "draft") return;
  // Withdrawing a release is an administrator's call, wherever it is triggered from.
  if (!can("admin")) {
    toast("Only a System Administrator can unlock an approved standard.", "bad");
    return;
  }
  s.status = "draft";
  s.approved_by_id = null;
  s.approved_at = null;
  audit("standard.revise", "standard", s.id, { code: s.code });
  save();
  go(`#/standards/${s.id}/edit`);
  render();
  toast(`${s.code} unlocked — all parameters are editable`, "good");
}

/* --------------------------------------------------------- report actions */
function recalcReport(report) {
  const rows = db.results.filter(r => r.report_id === report.id)
    .map(r => ({ result: r.result, classification: byId("parameters", r.parameter_id).classification }));
  const s = summarise(rows);
  Object.assign(report, {
    total_parameters: s.total, passed_parameters: s.passed, failed_parameters: s.failed,
    pending_parameters: s.pending, critical_failures: s.critical,
    major_failures: s.major, minor_failures: s.minor, overall_result: s.overall,
    updated_at: new Date().toISOString(),
  });
  if (report.status === "draft" && report.lot_quantity) {
    if (s.overall === "ACCEPTED") {
      report.accepted_quantity = report.lot_quantity;
      report.rejected_quantity = report.rework_quantity = 0;
    } else if (s.overall === "REJECTED") {
      report.rejected_quantity = report.lot_quantity;
      report.accepted_quantity = report.rework_quantity = 0;
    }
  }
  return s;
}

function saveResults(reportId) {
  const report = byId("reports", reportId);
  const drafts = state.drafts || {};
  Object.entries(drafts).forEach(([resultId, draft]) => {
    const row = byId("results", resultId);
    if (!row) return;
    const p = byId("parameters", row.parameter_id);
    if ("readings" in draft) row.readings = draft.readings;
    if ("remarks" in draft) row.remarks = draft.remarks;
    if ("defect_id" in draft) row.defect_id = draft.defect_id;
    if ("defect_description" in draft) row.defect_description = draft.defect_description;
    if ("manual_result" in draft) row.actual_text =
      draft.manual_result === PASS ? "Conforms" : draft.manual_result === FAIL ? "Does not conform" : row.actual_text;

    const manual = "manual_result" in draft
      ? draft.manual_result
      : (p.is_attribute && row.result !== PENDING ? row.result : null);
    const verdict = evaluateSample(p, row.readings, manual);
    row.result = verdict.result;
    row.deviation = verdict.deviation;
    row.reading_min = verdict.min;
    row.reading_max = verdict.max;
    // Keep a single representative value so summaries and exports stay simple.
    row.actual_value = verdict.max ?? null;
    if (verdict.result !== FAIL) { row.defect_id = null; row.defect_description = null; }
    else if (!row.defect_description) row.defect_description = verdict.reason;
  });

  const s = recalcReport(report);
  state.drafts = {};
  audit("report.results.save", "report", report.id, { overall: s.overall });
  save(); render();
  toast(`Saved — ${titleCase(s.overall)} · ${s.passed} pass, ${s.failed} fail`,
        s.overall === "ACCEPTED" ? "good" : s.failed ? "bad" : "");
}

function submitReport(reportId, signature) {
  const report = byId("reports", reportId);
  const s = recalcReport(report);
  if (s.pending) { toast(`${s.pending} parameter(s) still pending a result`, "bad"); return false; }
  report.status = "submitted";
  report.inspector_signature = signature;
  report.inspector_signed_at = new Date().toISOString();
  audit("report.submit", "report", report.id);
  save(); render();
  toast("Report signed and submitted for QA approval", "good");
  return true;
}

function qaDecide(reportId, decision, payload) {
  const report = byId("reports", reportId);
  report.accepted_quantity = payload.accepted;
  report.rejected_quantity = payload.rejected;
  report.rework_quantity = payload.rework;
  report.status = decision;
  report.qa_approver_id = state.user.id;
  report.qa_signature = payload.signature;
  report.qa_remarks = payload.remarks || null;
  report.qa_approved_at = new Date().toISOString();
  audit(`report.qa.${decision}`, "report", report.id, { remarks: payload.remarks });
  save(); render();
  toast(`Report ${decision}`, decision === "approved" ? "good" : "bad");
}

/* ================================================================ modals */
function openModal(title, bodyHtml, footerHtml, opts = {}) {
  closeModal();
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.id = "scrim";
  scrim.innerHTML = `<div class="modal ${opts.wide ? "wide" : ""}" role="dialog" aria-modal="true">
    <header><h2>${esc(title)}</h2><button class="btn sm" data-act="close-modal" aria-label="Close">✕</button></header>
    <div class="body">${bodyHtml}</div>
    ${footerHtml ? `<footer>${footerHtml}</footer>` : ""}</div>`;
  scrim.addEventListener("click", e => { if (e.target === scrim) closeModal(); });
  document.body.append(scrim);
  const first = scrim.querySelector("input,select,textarea");
  if (first) first.focus();
}
function closeModal() { pendingConfirm = null; $("#scrim")?.remove(); }

/* The browser's own confirm() can be switched off — Chrome offers "prevent
   this page from creating additional dialogs" after a few, and from then on it
   returns false without showing anything, which makes every button that relies
   on it look broken. Ask in our own modal instead. */
let pendingConfirm = null;

function askConfirm({ title, body, confirmLabel = "Confirm", danger = false, onConfirm }) {
  // openModal closes any existing modal first, and closing clears the pending
  // callback — so arm it only once the dialog is on screen.
  openModal(title, body,
    `<button class="btn" data-act="close-modal">Cancel</button>
     <button class="btn ${danger ? "danger" : "primary"}" data-act="modal-confirm">${esc(confirmLabel)}</button>`);
  pendingConfirm = onConfirm;
}

function isLastActiveAdmin(userId) {
  const admins = db.users.filter(u => u.role === "admin" && u.is_active);
  return admins.length === 1 && admins[0].id === Number(userId);
}

function saveUser(userId) {
  const err = $("#userError");
  const full_name = $("#usrName").value.trim();
  const email = $("#usrEmail").value.trim().toLowerCase();
  const role = $("#usrRole").value;
  const is_active = $("#usrActive").checked;
  const fail = msg => { err.innerHTML = `<div class="note fail" style="margin-bottom:12px">${esc(msg)}</div>`; };

  if (!full_name || !email) return fail("Name and email are both required.");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail("That does not look like an email address.");
  const clash = db.users.find(u => u.email === email && u.id !== Number(userId));
  if (clash) return fail(`${email} is already used by ${clash.full_name}.`);
  if (userId && isLastActiveAdmin(userId) && (role !== "admin" || !is_active))
    return fail("This is the only active administrator. Promote another user to admin first, "
      + "otherwise no one could manage accounts or unlock standards.");

  const data = { full_name, email, role, is_active, employee_code: $("#usrCode").value.trim() || null };
  let user;
  if (userId) {
    user = byId("users", userId);
    Object.assign(user, data);
    audit("user.update", "user", user.id, { email, role, is_active });
  } else {
    user = { id: nextId("users"), ...data };
    db.users.push(user);
    audit("user.create", "user", user.id, { email, role });
  }
  if (state.user && state.user.id === user.id) state.user = user;

  save(); closeModal(); render();
  toast(userId ? `Updated ${user.full_name}` : `Added ${user.full_name} as ${titleCase(role)}`, "good");
}

/** Change one user's access level straight from the table. */
function setUserRole(userId, role) {
  const u = byId("users", userId);
  if (!u) return;
  if (isLastActiveAdmin(userId) && role !== "admin") {
    toast("Cannot change the only active administrator's access. Promote someone else first.", "bad");
    render();
    return;
  }
  u.role = role;
  if (state.user && state.user.id === u.id) state.user = u;
  audit("user.role", "user", u.id, { role });
  save(); render();
  toast(`${u.full_name} is now ${titleCase(role)}`, "good");
}

function setUserActive(userId, active) {
  const u = byId("users", userId);
  if (!u) return;
  if (!active && isLastActiveAdmin(userId)) {
    toast("Cannot deactivate the only active administrator.", "bad");
    render();
    return;
  }
  u.is_active = active;
  audit(active ? "user.activate" : "user.deactivate", "user", u.id);
  // Don't leave the session acting as a disabled account.
  if (!active && state.user && state.user.id === u.id) {
    const fallback = db.users.find(x => x.is_active && x.role === "admin")
      || db.users.find(x => x.is_active);
    if (fallback) {
      state.user = fallback;
      localStorage.setItem(SESSION_KEY, String(fallback.id));
      toast(`Now acting as ${fallback.full_name} — ${u.full_name} was disabled`);
    }
  }
  save(); render();
  toast(`${u.full_name} ${active ? "activated" : "deactivated"}`, "good");
}

function saveInstrument(instrumentId, assignToParameter) {
  const code = $("#insCode").value.trim();
  const name = $("#insName").value.trim();
  const err = $("#instrumentError");
  if (!code || !name)
    return err.innerHTML = `<div class="note fail" style="margin-bottom:12px">Code and name are both required.</div>`;
  const clash = db.instruments.find(x => x.code.toLowerCase() === code.toLowerCase() && x.id !== Number(instrumentId));
  if (clash)
    return err.innerHTML = `<div class="note fail" style="margin-bottom:12px">Code ${esc(code)} is already used by ${esc(clash.name)}.</div>`;

  const data = {
    code, name, type: $("#insType").value,
    least_count: $("#insLc").value.trim() || null,
    range_text: $("#insRange").value.trim() || null,
    calibration_due: $("#insCal").value || null,
    is_active: $("#insActive").checked,
  };

  let instrument;
  if (instrumentId) {
    instrument = byId("instruments", instrumentId);
    Object.assign(instrument, data);
    audit("instrument.update", "instrument", instrument.id, { code });
  } else {
    instrument = { id: nextId("instruments"), ...data };
    db.instruments.push(instrument);
    audit("instrument.create", "instrument", instrument.id, { code });
  }

  if (assignToParameter) {
    const p = byId("parameters", assignToParameter);
    if (p) { p.instrument_id = instrument.id; p.instrument_text = instrument.name; }
  }
  // Keep every parameter's cached instrument name in step with the master.
  db.parameters.forEach(p => {
    if (p.instrument_id === instrument.id) p.instrument_text = instrument.name;
  });

  save();
  closeModal();
  render();
  toast(instrumentId ? `Updated ${instrument.name}` : `Added ${instrument.name}`, "good");
}

function qaCheckQuantities(reportId) {
  const report = byId("reports", reportId);
  const box = $("#qaMismatch");
  if (!box) return;
  const total = ["qaAccepted", "qaRejected", "qaRework"].reduce((a, id) => a + (Number($("#" + id).value) || 0), 0);
  box.innerHTML = report.lot_quantity && total !== report.lot_quantity
    ? `<div class="note warn">Accepted + rejected + rework = ${total}, but the lot quantity is ${report.lot_quantity}.</div>`
    : "";
}

/* ================================================================ exports */
function toCsv(rows) {
  return rows.map(r => r.map(v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(",")).join("\r\n");
}
function downloadCsv(filename, rows) {
  const blob = new Blob(["﻿" + toCsv(rows)], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Downloaded ${filename}`, "good");
}

function exportReportCsv(reportId) {
  const report = byId("reports", reportId);
  const part = byId("parts", report.part_id), drawing = byId("drawings", report.drawing_id);
  const rows = [
    ["INSPECTION REPORT", report.report_number],
    [],
    ["Company name", report.company_name, "Supplier name", byId("suppliers", report.supplier_id)?.name || "", "Customer name", report.customer_name],
    ["Part name", part?.part_name || "", "Part number", part?.part_number || "", "Drawing number", drawing?.drawing_number || ""],
    ["Drawing revision", report.drawing_revision, "Batch / lot number", report.batch_number, "PO number", report.po_number],
    ["Invoice number", report.invoice_number, "Inspection date", report.inspection_date, "Shift", report.shift],
    ["Machine number", report.machine_number, "Operator name", report.operator_name, "Inspector name", report.inspector_name],
    [],
    ["S.No", "Inspection parameter", "Specification", "Tolerance", "Inspection method", "Instrument",
     "Actual readings", "Min", "Max", "Result", "Deviation", "Defect description", "Inspector remarks"],
  ];
  db.results.filter(r => r.report_id === report.id).sort((a, b) => a.seq - b.seq).forEach(r => {
    const p = byId("parameters", r.parameter_id);
    rows.push([r.seq, p.parameter, `${p.specification} ${p.unit || ""}`.trim(), tolText(p),
      p.inspection_method || "", byId("instruments", p.instrument_id)?.name || p.instrument_text || "",
      p.is_attribute ? (r.actual_text || "") : (r.readings || ""),
      r.reading_min ?? "", r.reading_max ?? "",
      r.result, r.deviation ?? "", r.defect_description || "", r.remarks || ""]);
  });
  rows.push([], ["FINAL INSPECTION SUMMARY"],
    ["Total parameters checked", report.total_parameters],
    ["Passed parameters", report.passed_parameters],
    ["Failed parameters", report.failed_parameters],
    ["Critical failures", report.critical_failures],
    ["Overall inspection result", report.overall_result],
    ["Accepted quantity", report.accepted_quantity],
    ["Rejected quantity", report.rejected_quantity],
    ["Rework quantity", report.rework_quantity],
    [], ["Inspector signature", report.inspector_signature || "", "Signed at", report.inspector_signed_at || ""],
    ["QA approval", report.qa_signature || "", "Approved at", report.qa_approved_at || ""],
    ["Digital approval status", report.status.toUpperCase()],
    ["QA remarks", report.qa_remarks || ""]);
  downloadCsv(`${report.report_number}.csv`, rows);
}

function exportReportListCsv() {
  const rows = [["Report no.", "Part number", "Supplier", "Batch", "PO", "Invoice", "Date", "Shift",
    "Inspector", "Checked", "Passed", "Failed", "Critical", "Accepted qty", "Rejected qty",
    "Rework qty", "Result", "Status"]];

/* ============================================================ interaction */
let pendingFile = null;

document.addEventListener("click", e => {
  /* A disabled field swallows its own click, but the click still reaches the
     cell. Offer to unlock rather than leaving the user tapping a dead grid. */
  const lockedGrid = e.target.closest("[data-locked-standard]");
  if (lockedGrid && e.target.closest("td")) {
    const id = Number(lockedGrid.dataset.lockedStandard);
    const s = byId("standards", id);
    if (!s) return;
    if (!can("admin")) {
      toast(`${s.code} is ${s.status} and read-only. Only a System Administrator can unlock it.`);
      return;
    }
    askConfirm({
      title: `${s.code} is locked`,
      confirmLabel: "Unlock all parameters",
      body: `<p style="font-size:13.5px">This standard is <b>${esc(s.status)}</b>, so its parameters
        are read-only. Unlocking withdraws the approval; it must be approved again before new
        inspection reports can be raised.</p>`,
      onConfirm: () => unlockStandard(id),
    });
    return;
  }

  const tab = e.target.closest("[data-tab]");
  if (tab) { state.adminTab = tab.dataset.tab; render(); return; }

  const gran = e.target.closest("[data-gran]");
  if (gran) { state.trendGranularity = gran.dataset.gran; render(); return; }

  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;

  switch (act) {
    case "rail":
      state.railOpen = !state.railOpen;
      $("#rail").classList.toggle("open", state.railOpen);
      break;

    case "theme": {
      const root = document.documentElement;
      const now = root.getAttribute("data-theme");
      const dark = now ? now === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      root.setAttribute("data-theme", dark ? "light" : "dark");
      localStorage.setItem("qip.theme", dark ? "light" : "dark");
      break;
    }

    case "settings": go("#/settings"); break;
    case "print": window.print(); break;
    case "close-modal": closeModal(); break;

    case "upload": uploadModal(); break;
    case "do-upload": doUpload(); break;
    case "analyze": runAnalysis(Number(id)); break;
    case "save-extraction": persistExtraction(Number(btn.dataset.rev)); break;
    case "gen-standard": generateStandard(Number(btn.dataset.rev)); break;

    case "save-standard":
      audit("standard.update", "standard", Number(id));
      save(); render(); toast("Inspection standard saved", "good");
      break;

    case "add-param": {
      const sid = Number(id);
      const seq = db.parameters.filter(p => p.standard_id === sid).length + 1;
      db.parameters.push({
        id: nextId("parameters"), standard_id: sid, seq,
        parameter: "New characteristic", specification: "",
        nominal_value: null, upper_tolerance: null, lower_tolerance: null, unit: "mm",
        inspection_method: "Variable measurement", instrument_id: null, instrument_text: null,
        frequency: "5 pcs per lot", sampling_plan: "ISO 2859-1, Level II, AQL 0.65",
        acceptance_criteria: "", classification: "major", reference_dimension: null, remarks: null,
        is_attribute: false, requires_manual_verification: true,
        source_confidence: null, source_note: "Added manually by Quality Engineer",
      });
      save(); render();
      break;
    }

    case "approve-standard": {
      const standard = byId("standards", id);
      const params = db.parameters.filter(p => p.standard_id === standard.id);
      if (!params.length) return toast("The standard has no inspection parameters", "bad");
      const unver = params.filter(p => p.requires_manual_verification).map(p => p.seq);
      if (unver.length)
        return toast(`Cannot approve — S.No ${unver.join(", ")} still ` +
          `${unver.length === 1 ? "requires" : "require"} manual verification`, "bad");
      standard.status = "approved";
      standard.approved_by_id = state.user.id;
      standard.approved_at = new Date().toISOString();
      audit("standard.approve", "standard", standard.id);
      save(); render();
      toast(`${standard.code} approved and released for inspection`, "good");
      break;
    }

    case "new-report": newReportModal(Number(id)); break;
    case "do-create-report":
      createReport(Number(id), {
        supplier_id: $("#nrSupplier").value, batch_number: $("#nrBatch").value,
        inspection_date: $("#nrDate").value, po_number: $("#nrPo").value,
        invoice_number: $("#nrInv").value, shift: $("#nrShift").value,
        machine_number: $("#nrMachine").value, operator_name: $("#nrOperator").value,
        lot_quantity: $("#nrLot").value, sample_quantity: $("#nrSample").value,
      });
      closeModal();
      break;

    case "save-results": saveResults(Number(id)); break;
    case "sign": signModal(Number(id)); break;
    case "do-sign": {
      const name = $("#signName").value.trim();
      if (!name) return toast("Enter your name to sign", "bad");
      if (submitReport(Number(id), name)) closeModal();
      break;
    }
    case "qa": qaModal(Number(id)); break;
    case "do-qa": {
      const name = $("#qaName").value.trim();
      if (!name) return toast("Enter your name to sign", "bad");
      qaDecide(Number(id), btn.dataset.decision, {
        signature: name, remarks: $("#qaRemarks").value.trim(),
        accepted: Number($("#qaAccepted").value) || 0,
        rejected: Number($("#qaRejected").value) || 0,
        rework: Number($("#qaRework").value) || 0,
      });
      closeModal();
      break;
    }

    case "revise-standard": {
      const s = byId("standards", id);
      const closed = db.reports.filter(r => r.standard_id === s.id && CLOSED_STATES.has(r.status)).length;
      askConfirm({
        title: `Unlock ${s.code}?`,
        confirmLabel: "Unlock all parameters",
        body: `<p style="font-size:13.5px">Its approval is withdrawn and it must be approved again
            before new inspection reports can be raised.</p>
          ${closed ? `<div class="note info" style="margin-top:10px">${closed} closed report(s)
            already reference it. Those keep the values they were inspected against.</div>` : ""}`,
        onConfirm: () => unlockStandard(Number(id)),
      });
      break;
    }

    case "modal-confirm": {
      const run = pendingConfirm;
      pendingConfirm = null;
      closeModal();
      if (run) run();
      break;
    }

    case "delete-param": {
      const p = byId("parameters", id);
      if (!p) return;
      const recorded = db.results.filter(r => r.parameter_id === p.id).length;
      askConfirm({
        title: `Remove S.No ${p.seq}?`,
        danger: true,
        confirmLabel: "Remove characteristic",
        body: `<p style="font-size:13.5px">Remove <b>${esc(p.parameter)}</b> from this standard?</p>
          ${recorded ? `<div class="note warn" style="margin-top:10px">${recorded} recorded
            result(s) will be removed with it.</div>` : ""}
          <div class="note fail" style="margin-top:10px">This cannot be undone.</div>`,
        onConfirm: () => deleteParameter(Number(id)),
      });
      break;
    }

    case "reset-cols": resetColumnWidths(btn.dataset.key); break;

    case "add-user": userModal(null); break;
    case "edit-user": userModal(Number(id)); break;
    case "save-user": saveUser(btn.dataset.id || null); break;

    case "add-supplier": supplierModal(null); break;
    case "edit-supplier": supplierModal(Number(id)); break;
    case "save-supplier": saveSupplier(btn.dataset.id || null); break;

    case "add-instrument": instrumentModal(null, null); break;
    case "edit-instrument": instrumentModal(Number(id), null); break;
    case "save-instrument":
      saveInstrument(btn.dataset.id || null, btn.dataset.param || null);
      break;

    case "ask-delete-drawing": confirmDeleteDrawing(Number(id)); break;
    case "do-delete-drawing": closeModal(); deleteDrawing(Number(id)); break;

    case "delete-standard": {
      const s = byId("standards", id);
      askConfirm({
        title: `Delete ${s.code}?`, danger: true, confirmLabel: "Delete standard",
        body: `<p style="font-size:13.5px">This draft standard and its
            ${db.parameters.filter(p => p.standard_id === s.id).length} parameters will be removed.</p>
          <div class="note fail" style="margin-top:10px">This cannot be undone.</div>`,
        onConfirm: () => deleteStandard(Number(id)),
      });
      break;
    }
    case "delete-report": {
      const r = byId("reports", id);
      askConfirm({
        title: `Delete ${r.report_number}?`, danger: true, confirmLabel: "Delete report",
        body: `<p style="font-size:13.5px">This draft report and its recorded results will be removed.</p>
          <div class="note fail" style="margin-top:10px">This cannot be undone.</div>`,
        onConfirm: () => deleteReport(Number(id)),
      });
      break;
    }

    case "export-report": exportReportCsv(Number(id)); break;
    case "export-list": exportReportListCsv(); break;
    case "export-json": exportJson(); break;

    case "save-settings":
      settings.apiKey = $("#setKey").value.trim();
      settings.model = $("#setModel").value;
      settings.threshold = Number($("#setThreshold").value);
      saveSettings(); render();
      toast(settings.apiKey ? "Settings saved — live AI extraction enabled"
                            : "Settings saved — running the offline extractor", "good");
      break;

    case "reset-demo":
      askConfirm({
        title: "Rebuild the demo dataset?", danger: true, confirmLabel: "Discard and rebuild",
        body: `<p style="font-size:13.5px">Every drawing, standard and report stored in this
            browser is discarded and the seeded example is rebuilt.</p>
          <div class="note fail" style="margin-top:10px">This cannot be undone. Export your data
            first from Settings if you need it.</div>`,
        onConfirm: () => {
          localStorage.removeItem(DB_KEY);
          seed(); state.drafts = {}; state.draftExtraction = null;
          render(); toast("Demo data rebuilt", "good");
        },
      });
      break;
  }
});

document.addEventListener("change", e => {
  if (e.target.dataset.userRole !== undefined) {
    setUserRole(Number(e.target.dataset.userRole), e.target.value);
    return;
  }
  if (e.target.dataset.userActive !== undefined) {
    setUserActive(Number(e.target.dataset.userActive), e.target.checked);
    return;
  }
  if (e.target.id === "usrRole") { updateAccessNote(); return; }
  if (e.target.id !== "roleSwitch") return;
  const user = byId("users", e.target.value);
  if (!user) return;
  state.user = user;
  localStorage.setItem(SESSION_KEY, String(user.id));
  state.drafts = {};
  state.draftExtraction = null;
  audit("role.switch", "user", user.id, { role: user.role });
  save();
  const entry = ROUTES.find(x => x[0] === currentRoute().name);
  if (entry && !can(entry[3])) go("#/dashboard"); else render();
  toast(`Acting as ${user.full_name} — ${titleCase(user.role)}`);
});

document.addEventListener("input", e => {
  const el = e.target;

  if (el.id === "globalSearch") {
    state.search = el.value;
    if (currentRoute().name !== "reports") { go("#/reports"); return; }
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(() => { render(); $("#globalSearch")?.focus(); }, 220);
    return;
  }
  if (el.id === "setThreshold") {
    el.previousElementSibling.textContent = `Confidence threshold — ${(Number(el.value) * 100).toFixed(0)}%`;
    return;
  }
  if (["qaAccepted", "qaRejected", "qaRework"].includes(el.id)) {
    qaCheckQuantities(Number($("[data-act='do-qa']").dataset.id));
    return;
  }

  /* list filters — re-render but keep the caret where it was */
  const filterMap = {
    drawingQuery: "drawingQuery", drawingStatus: "drawingStatus",
    standardQuery: "standardQuery", standardStatus: "standardStatus",
  };
  if (filterMap[el.id]) {
    state[filterMap[el.id]] = el.value;
    rerenderKeepingFocus(el.id, el.selectionStart);
    return;
  }
  if (el.id.startsWith("rf")) {
    const f = state.reportFilters;
    if (el.id === "rfQ") { f.q = el.value; state.search = el.value; }
    if (el.id === "rfStatus") f.status = el.value;
    if (el.id === "rfSupplier") f.supplier = el.value;
    if (el.id === "rfFrom") f.from = el.value;
    if (el.id === "rfTo") f.to = el.value;
    rerenderKeepingFocus(el.id, el.selectionStart);
    return;
  }

  /* extraction verification grid — edits go to a draft, never straight to the record */
  if (el.dataset.dim !== undefined || el.dataset.verify !== undefined || el.dataset.header !== undefined) {
    const rev = db.revisions.find(r => r.drawing_id === Number(currentRoute().id) && r.is_current);
    if (!rev?.extraction) return;
    if (!state.draftExtraction) state.draftExtraction = JSON.parse(JSON.stringify(rev.extraction));
    const ex = state.draftExtraction;

    if (el.dataset.header !== undefined) {
      ex[el.dataset.header] = el.value;
      ex.header_requires_verification[el.dataset.header] = el.value.trim() === "";
      return;
    }
    if (el.dataset.verify !== undefined) {
      const d = ex.dimensions[Number(el.dataset.verify)];
      d.requires_manual_verification = !el.checked;
      d.verification_reasons = el.checked ? [] : ["Marked for manual verification by Quality Engineer"];
      rerenderKeepingFocus(null);
      return;
    }
    const d = ex.dimensions[Number(el.dataset.dim)];
    // A verified characteristic is frozen. Enforce it against the model, not
    // just the disabled attribute, so no path can write to a locked row.
    if (!d.requires_manual_verification || !can("quality_manager")) return;

    const field = el.dataset.field;
    d[field] = ["nominal_value", "upper_tolerance", "lower_tolerance"].includes(field)
      ? (el.value === "" ? null : Number(el.value)) : el.value;
    // Class drives the row's severity stripe, so repaint when it changes.
    if (field === "classification") rerenderKeepingFocus(null);
    return;
  }

  /* inspection-standard grid — writes straight through, saved on Save changes */
  if (el.dataset.param !== undefined) {
    const p = byId("parameters", el.dataset.param);
    const field = el.dataset.field;
    if (field === "is_attribute") { p.is_attribute = el.checked; rerenderKeepingFocus(null); return; }
    if (field === "instrument_id") {
      if (el.value === "__new__") { instrumentModal(null, p.id); return; }
      p.instrument_id = el.value ? Number(el.value) : null;
      p.instrument_text = byId("instruments", p.instrument_id)?.name || p.instrument_text;
      save(); rerenderKeepingFocus(null);
      return;
    }
    p[field] = ["nominal_value", "upper_tolerance", "lower_tolerance"].includes(field)
      ? (el.value === "" ? null : Number(el.value)) : el.value;
    if (["nominal_value", "upper_tolerance", "lower_tolerance"].includes(field))
      p.acceptance_criteria = acceptanceText(p);
    return;
  }
  if (el.dataset.verifyParam !== undefined) {
    const p = byId("parameters", el.dataset.verifyParam);
    p.requires_manual_verification = el.checked;
    p.acceptance_criteria = acceptanceText(p);
    audit(el.checked ? "parameter.hold" : "parameter.verify", "parameter", p.id,
      { parameter: p.parameter });
    save(); render();
    return;
  }

  /* inspection result grid — live preview via drafts */
  if (el.dataset.result !== undefined) {
    const resultId = Number(el.dataset.result);
    const field = el.dataset.field;
    state.drafts = state.drafts || {};
    const draft = state.drafts[resultId] || (state.drafts[resultId] = {});
    if (field === "defect_id") draft.defect_id = el.value ? Number(el.value) : null;
    else draft[field] = el.value;

    if (field === "defect_id" && draft.defect_id)
      draft.defect_description = byId("defects", draft.defect_id)?.name || "";

    /* Only the verdict-changing fields need a repaint. */
    if (field === "readings" || field === "manual_result" || field === "defect_id")
      rerenderKeepingFocus(null, el.selectionStart, el);
  }
});

/* ==================================================== resizable columns
   Any grid marked data-cols can have its columns dragged wider or narrower by
   the header's right edge. Widths are remembered per grid so they survive a
   re-render and a reload. The table switches to a fixed layout once sized, so
   widening one column extends the table rather than squeezing its neighbours.
   ======================================================================== */
const MIN_COL = 44;

function columnWidths(key) {
  settings.columnWidths = settings.columnWidths || {};
  return settings.columnWidths[key] || null;
}

function setupResizableColumns() {
  $$(".tablewrap[data-cols]").forEach(wrap => {
    const table = wrap.querySelector("table");
    const heads = table ? [...table.querySelectorAll("thead th")] : [];
    if (!heads.length) return;
    const key = wrap.dataset.cols;

    // First sight of this grid: adopt whatever the browser laid out as the baseline.
    let widths = columnWidths(key);
    if (!widths || widths.length !== heads.length) {
      widths = heads.map(th => Math.round(th.getBoundingClientRect().width));
    }

    table.style.tableLayout = "fixed";
    table.style.width = widths.reduce((a, b) => a + b, 0) + "px";
    heads.forEach((th, i) => {
      th.style.width = widths[i] + "px";
      if (!th.querySelector(".col-grip")) {
        const grip = document.createElement("div");
        grip.className = "col-grip";
        grip.dataset.col = String(i);
        grip.title = "Drag to resize · double-click to fit the content";
        th.append(grip);
      }
    });
  });
}

function storeColumnWidths(wrap) {
  const table = wrap.querySelector("table");
  const heads = [...table.querySelectorAll("thead th")];
  settings.columnWidths = settings.columnWidths || {};
  settings.columnWidths[wrap.dataset.cols] = heads.map(th => Math.round(th.getBoundingClientRect().width));
  saveSettings();
}

function applyColumnWidth(wrap, index, px) {
  const table = wrap.querySelector("table");
  const heads = [...table.querySelectorAll("thead th")];
  const width = Math.max(MIN_COL, Math.round(px));
  heads[index].style.width = width + "px";
  const total = heads.reduce((sum, th) => sum + parseFloat(th.style.width || 0), 0);
  table.style.width = total + "px";
}

/** Widest content in a column, so double-click can fit it. */
function naturalColumnWidth(wrap, index) {
  const table = wrap.querySelector("table");
  let widest = MIN_COL;
  table.querySelectorAll("tbody tr").forEach(tr => {
    const cell = tr.children[index];
    if (!cell) return;
    const field = cell.querySelector("input, select");
    widest = Math.max(widest, field ? field.scrollWidth + 26 : cell.scrollWidth + 16);
  });
  const th = table.querySelectorAll("thead th")[index];
  return Math.min(560, Math.max(widest, th.scrollWidth + 20));
}

let dragCol = null;

document.addEventListener("mousedown", e => {
  const grip = e.target.closest(".col-grip");
  if (!grip) return;
  const wrap = grip.closest(".tablewrap[data-cols]");
  const index = Number(grip.dataset.col);
  const th = wrap.querySelectorAll("thead th")[index];
  dragCol = { wrap, index, startX: e.clientX, startWidth: th.getBoundingClientRect().width, grip };
  grip.classList.add("dragging");
  document.body.classList.add("col-resizing");
  e.preventDefault();
});

document.addEventListener("mousemove", e => {
  if (!dragCol) return;
  applyColumnWidth(dragCol.wrap, dragCol.index, dragCol.startWidth + (e.clientX - dragCol.startX));
});

document.addEventListener("mouseup", () => {
  if (!dragCol) return;
  dragCol.grip.classList.remove("dragging");
  document.body.classList.remove("col-resizing");
  storeColumnWidths(dragCol.wrap);
  dragCol = null;
  refreshCellTooltips();
});

document.addEventListener("dblclick", e => {
  const grip = e.target.closest(".col-grip");
  if (!grip) return;
  const wrap = grip.closest(".tablewrap[data-cols]");
  const index = Number(grip.dataset.col);
  applyColumnWidth(wrap, index, naturalColumnWidth(wrap, index));
  storeColumnWidths(wrap);
  refreshCellTooltips();
});

function resetColumnWidths(key) {
  if (settings.columnWidths) delete settings.columnWidths[key];
  saveSettings();
  render();
  toast("Column widths reset");
}

/** A grid cell can only be so wide; hovering shows whatever does not fit. */
function refreshCellTooltips() {
  $$(".tablewrap input.in.cell").forEach(el => {
    if (el.value && el.scrollWidth > el.clientWidth + 1) el.title = el.value;
    else el.removeAttribute("title");
  });
}

/** Re-render, then put the caret back so typing in a grid is not interrupted. */
function rerenderKeepingFocus(elementId, caret, sourceEl) {
  const key = sourceEl
    ? `[data-result="${sourceEl.dataset.result}"][data-field="${sourceEl.dataset.field}"]`
    : elementId ? `#${elementId}` : null;
  render();
  if (!key) return;
  const next = $(key);
  if (!next) return;
  next.focus();
  if (caret != null && next.setSelectionRange && next.type !== "number") {
    try { next.setSelectionRange(caret, caret); } catch (err) { /* unsupported input type */ }
  }
}

/* ---------------------------------------------------------------- upload */
function bindDropzone() {
  const zone = $("#dropzone"), input = $("#fileInput");
  if (!zone || !input) return;
  const pick = file => {
    if (!file) return;
    pendingFile = file;
    $("#dropLabel").textContent = `${file.name} — ${fmtBytes(file.size)}`;
    if (!$("#upNumber").value) $("#upNumber").value = file.name.replace(/\.[^.]+$/, "");
  };
  zone.addEventListener("click", () => input.click());
  zone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", () => pick(input.files[0]));
  ["dragenter", "dragover"].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.add("over");
  }));
  ["dragleave", "drop"].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.remove("over");
  }));
  zone.addEventListener("drop", e => pick(e.dataTransfer.files[0]));
}

async function doUpload() {
  const err = $("#uploadError");
  const number = $("#upNumber").value.trim();
  if (!pendingFile) return err.innerHTML = `<div class="note fail">Choose a drawing file first.</div>`;
  if (!number) return err.innerHTML = `<div class="note fail">Enter a drawing number.</div>`;
  if (pendingFile.size > 25 * 1024 * 1024)
    return err.innerHTML = `<div class="note fail">That file is ${fmtBytes(pendingFile.size)} — the limit is 25 MB.</div>`;

  const partNo = $("#upPartNo").value.trim();
  const partName = $("#upPartName").value.trim();
  let part = partNo ? db.parts.find(p => p.part_number === partNo) : null;
  if (partNo && !part) {
    part = { id: nextId("parts"), part_number: partNo, part_name: partName || partNo,
             material: null, customer_name: null, supplier_id: null };
    db.parts.push(part);
  }

  const drawing = {
    id: nextId("drawings"), drawing_number: number, title: $("#upTitle").value.trim() || null,
    part_id: part ? part.id : null, file_name: pendingFile.name,
    mime_type: pendingFile.type || "application/octet-stream", file_size: pendingFile.size,
    status: "uploaded", uploaded_by_id: state.user.id, created_at: new Date().toISOString(),
  };
  db.drawings.push(drawing);
  db.revisions.push({
    id: nextId("revisions"), drawing_id: drawing.id, revision: $("#upRev").value.trim() || "-",
    is_current: true, status: "uploaded", extraction: null, extraction_confidence: null,
    extraction_engine: null, extraction_error: null, analyzed_at: null,
    verified_by_id: null, verified_at: null, created_at: new Date().toISOString(),
  });

  state.files = state.files || new Map();
  state.files.set(drawing.id, pendingFile);
  blobs.set(drawing.id, URL.createObjectURL(pendingFile));

  // Keep the sheet permanently, so the preview survives a reload.
  const stored = await putSheet(drawing.id, pendingFile);
  if (!stored) toast("Sheet kept for this session only — browser storage refused it", "bad");

  const analyze = $("#upAnalyze").checked;
  audit("drawing.upload", "drawing", drawing.id,
    { file: pendingFile.name, persisted: stored });
  save();
  pendingFile = null;
  closeModal();
  go(`#/drawings/${drawing.id}`);
  render();
  if (analyze) setTimeout(() => runAnalysis(drawing.id), 60);
}

/* ------------------------------------------------------------------ boot */
window.addEventListener("hashchange", () => {
  state.drafts = {};
  state.draftExtraction = null;
  state.railOpen = false;
  render();
  window.scrollTo(0, 0);
});

/* Modal DOM is created after render, so bind the dropzone when it appears. */
new MutationObserver(() => { if ($("#dropzone")) bindDropzone(); })
  .observe(document.body, { childList: true });

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/** Same mark in the browser tab, as an inline data URI. */
function setFavicon() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -13 128 84">` +
    logoSvg().replace(/^<svg[^>]*>|<\/svg>$/g, "").replace(/currentColor/g, "#1a6b7a") +
    `</svg>`;
  const link = document.createElement("link");
  link.rel = "icon";
  link.type = "image/svg+xml";
  link.href = "data:image/svg+xml," + encodeURIComponent(svg);
  document.head.append(link);
}

(function boot() {
  const theme = localStorage.getItem("qip.theme");
  if (theme) document.documentElement.setAttribute("data-theme", theme);
  try { settings = { ...settings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; } catch (e) { /* defaults */ }

  setFavicon();
  loadDb();
  // No sign-in gate: open straight into the workspace. The rail's "Acting as"
  // switcher changes role, so RBAC is still exercised without a login wall.
  state.user = byId("users", localStorage.getItem(SESSION_KEY))
    || db.users.find(u => u.role === "admin")
    || db.users[0];
  state.drafts = {};
  if (!location.hash) location.hash = "#/dashboard";
  render();
})();
</script>
