<style>
/* ============================================================ tokens */
:root {
  --ground:        #f2f4f3;
  --surface:       #ffffff;
  --surface-2:     #eaeeee;
  --surface-sunk:  #e2e7e7;
  --line:          #d3dad9;
  --line-strong:   #b3bdbc;
  --ink:           #14181c;
  --ink-2:         #454f52;
  --ink-3:         #6d7a7c;
  --accent:        #1a6b7a;
  --accent-soft:   #e0eef0;
  --accent-line:   #9cc7ce;
  --pass:          #2f7a4e;
  --pass-soft:     #e2f0e7;
  --fail:          #b4342a;
  --fail-soft:     #fae7e5;
  --warn:          #a4691a;
  --warn-soft:     #f8eeda;
  --rail:          #12191b;
  --rail-ink:      #b9c7c9;
  --rail-hi:       #ffffff;
  --shadow:        0 1px 2px rgba(20,24,28,.05), 0 2px 8px rgba(20,24,28,.06);
  --radius:        4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:       #0e1214;
    --surface:      #161b1d;
    --surface-2:    #1d2426;
    --surface-sunk: #101617;
    --line:         #2a3335;
    --line-strong:  #3c4749;
    --ink:          #e6ebeb;
    --ink-2:        #adb9ba;
    --ink-3:        #7f8d8f;
    --accent:       #58b6c6;
    --accent-soft:  #16323a;
    --accent-line:  #2b5f6b;
    --pass:         #5fbd85;
    --pass-soft:    #14301f;
    --fail:         #ef8177;
    --fail-soft:    #371916;
    --warn:         #d9a44e;
    --warn-soft:    #33260f;
    --rail:         #090d0e;
    --rail-ink:     #93a3a5;
    --shadow:       0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
  }
}
[data-theme="dark"] {
  --ground:       #0e1214;
  --surface:      #161b1d;
  --surface-2:    #1d2426;
  --surface-sunk: #101617;
  --line:         #2a3335;
  --line-strong:  #3c4749;
  --ink:          #e6ebeb;
  --ink-2:        #adb9ba;
  --ink-3:        #7f8d8f;
  --accent:       #58b6c6;
  --accent-soft:  #16323a;
  --accent-line:  #2b5f6b;
  --pass:         #5fbd85;
  --pass-soft:    #14301f;
  --fail:         #ef8177;
  --fail-soft:    #371916;
  --warn:         #d9a44e;
  --warn-soft:    #33260f;
  --rail:         #090d0e;
  --rail-ink:     #93a3a5;
  --shadow:       0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
}

/* ============================================================ base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "Barlow", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
.num { font-variant-numeric: tabular-nums; }

/* label vernacular borrowed from a drawing title block */
.lbl {
  font-family: "Barlow Condensed", "Barlow", sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
  line-height: 1.3;
}

/* ============================================================ shell */
.app { display: flex; min-height: 100vh; }
.rail {
  width: 232px; flex: 0 0 232px;
  background: var(--rail); color: var(--rail-ink);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.rail-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.09);
}
.rail-mark {
  width: 30px; height: 30px; flex: none;
  display: grid; place-items: center;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 15px;
  letter-spacing: .04em;
}
.rail-brand strong { color: var(--rail-hi); font-size: 14px; font-weight: 600; display: block; letter-spacing: .01em; }
.rail-brand span { font-size: 11px; color: #6d7f81; letter-spacing: .05em; text-transform: uppercase;
  font-family: "Barlow Condensed", sans-serif; font-weight: 600; }
.rail nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.rail nav a {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 10px; border-radius: var(--radius);
  color: var(--rail-ink); font-size: 13.5px; text-decoration: none;
  border-left: 2px solid transparent;
}
.rail nav a:hover { background: rgba(255,255,255,.06); color: var(--rail-hi); text-decoration: none; }
.rail nav a.on { background: rgba(255,255,255,.09); color: var(--rail-hi); border-left-color: var(--accent); font-weight: 500; }
.rail nav a .ic { width: 16px; text-align: center; opacity: .8; font-size: 13px; }
.rail-foot { margin-top: auto; padding: 14px; border-top: 1px solid rgba(255,255,255,.09); }
.rail-foot .who { color: var(--rail-hi); font-size: 13px; font-weight: 500; }
.rail-foot .role { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #6d7f81;
  font-family: "Barlow Condensed", sans-serif; font-weight: 600; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 56px; flex: none;
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.topbar input[type="search"] {
  flex: 1; max-width: 460px;
  background: var(--surface-sunk); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 7px 11px; font-size: 13.5px;
}
.topbar input[type="search"]:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.content { padding: 22px 24px 60px; max-width: 1640px; width: 100%; }
.burger { display: none; }

/* ============================================================ page furniture */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.page-head h1 { font-size: 23px; letter-spacing: -.01em; }
.page-head .sub { color: var(--ink-3); font-size: 13.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card > header {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 14px; border-bottom: 1px solid var(--line);
}
.card > header h2 { font-family: "Barlow Condensed", sans-serif; font-size: 13px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.card .body { padding: 16px; }
.grid { display: grid; gap: 16px; }

/* KPI tile: reads as a gauge face */
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 14px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--line-strong); }
.kpi.k-accent::before { background: var(--accent); }
.kpi.k-pass::before   { background: var(--pass); }
.kpi.k-fail::before   { background: var(--fail); }
.kpi.k-warn::before   { background: var(--warn); }
.kpi .v { font-family: "Barlow Condensed", sans-serif; font-size: 30px; font-weight: 600; line-height: 1.05;
  margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi.k-pass .v { color: var(--pass); } .kpi.k-fail .v { color: var(--fail); }
.kpi.k-warn .v { color: var(--warn); } .kpi.k-accent .v { color: var(--accent); }
.kpi .h { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }

/* ============================================================ title block — the drawing-office device */
.titleblock { border: 1.5px solid var(--line-strong); display: grid; background: var(--surface);
  grid-template-columns: repeat(5, minmax(0, 1fr)); }
.titleblock > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 10px 8px; min-width: 0; }
.titleblock > div:nth-child(5n) { border-right: 0; }
.titleblock .val { font-size: 13.5px; font-weight: 500; margin-top: 2px; overflow-wrap: anywhere; }
.titleblock .val.mono { font-size: 12.5px; }

/* ============================================================ tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface-2); text-align: left; white-space: nowrap;
  padding: 8px 10px; border-bottom: 1px solid var(--line-strong);
  font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 11px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
}
tbody td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.row-fail { background: var(--fail-soft); }
tbody tr.row-fail:hover { background: var(--fail-soft); filter: brightness(.98); }
tbody tr.row-warn { background: var(--warn-soft); }
td.r, th.r { text-align: right; }
/* severity stripe encodes criticality without spending a column */
td.sev { border-left: 3px solid transparent; }
td.sev.critical { border-left-color: var(--fail); }
td.sev.major    { border-left-color: var(--warn); }
td.sev.minor    { border-left-color: var(--line-strong); }

/* ============================================================ controls */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--radius); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--fail); border-color: var(--fail); color: #fff; }
.btn.danger:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 9px; font-size: 12px; }

label.f { display: block; min-width: 0; }
label.f > .lbl { display: block; margin-bottom: 4px; }
.in {
  width: 100%; padding: 7px 10px; font-size: 13.5px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: var(--radius);
}
.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.in:disabled { background: var(--surface-sunk); color: var(--ink-3); }
.in.cell { padding: 4px 7px; font-size: 12.5px; }
.in.mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
.in.r { text-align: right; font-variant-numeric: tabular-nums; }
.in.bad { border-color: var(--fail); background: var(--fail-soft); font-weight: 600; color: var(--fail); }
textarea.in { resize: vertical; min-height: 62px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: 2px; font-size: 11px; font-weight: 600;
  font-family: "Barlow Condensed", sans-serif; letter-spacing: .07em; text-transform: uppercase;
  border: 1px solid; white-space: nowrap;
}
.chip.pass  { color: var(--pass); background: var(--pass-soft); border-color: var(--pass); }
.chip.fail  { color: var(--fail); background: var(--fail-soft); border-color: var(--fail); }
.chip.warn  { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
.chip.info  { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
.chip.mute  { color: var(--ink-3); background: var(--surface-2); border-color: var(--line-strong); }

.note { border: 1px solid; border-left-width: 3px; border-radius: var(--radius); padding: 9px 12px; font-size: 13px; }
.note.info { border-color: var(--accent-line); border-left-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.note.warn { border-color: var(--warn); background: var(--warn-soft); color: var(--ink); }
.note.fail { border-color: var(--fail); background: var(--fail-soft); color: var(--ink); }
.note.pass { border-color: var(--pass); background: var(--pass-soft); color: var(--ink); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.empty { padding: 44px 20px; text-align: center; color: var(--ink-3); font-size: 13.5px; }

/* ============================================================ modal */
.scrim { position: fixed; inset: 0; background: rgba(9,13,14,.55); z-index: 100;
  display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
.modal { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius);
  width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(9,13,14,.35); }
.modal.wide { max-width: 900px; }
.modal > header { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--line); }
.modal > header h2 { font-size: 15px; }
.modal .body { padding: 16px; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 16px; border-top: 1px solid var(--line); }

/* ============================================================ role switch */
.rail-foot select {
  width: 100%; margin-top: 9px; padding: 5px 8px; font-size: 12.5px;
  background: rgba(255,255,255,.07); color: var(--rail-hi);
  border: 1px solid rgba(255,255,255,.16); border-radius: var(--radius);
}
.rail-foot select option { background: var(--rail); color: var(--rail-hi); }

/* ============================================ BNC controlled-document view */
.doc { background: #fff; color: #000; padding: 16px; max-width: 1000px; margin: 0 auto;
  font-family: "Barlow", Arial, sans-serif; font-size: 12px; }
.doc table { border-collapse: collapse; width: 100%; }
.doc th, .doc td { border: 1px solid #000; padding: 3px 5px; vertical-align: middle; }
.doc thead th { background: #e8e8e8; color: #000; position: static;
  font-family: "Barlow", Arial, sans-serif; font-size: 11px; letter-spacing: 0;
  text-transform: none; font-weight: 700; text-align: center; }
.doc .band { background: #d8d8d8; font-weight: 700; text-align: center; letter-spacing: .06em; }
.doc .c { text-align: center; }
.doc .ctq { font-size: 14px; line-height: 1; }
.doc h1 { font-size: 16px; text-align: center; letter-spacing: .06em; }
.doc .sig { height: 54px; vertical-align: top; }
.doc-wrap { background: var(--surface-sunk); padding: 18px 0; }
@media print {
  .doc-wrap { background: #fff; padding: 0; }
  .doc { max-width: none; padding: 0; font-size: 10.5px; }
  .doc table { page-break-inside: auto; }
  .doc tr { page-break-inside: avoid; }
}

/* ============================================================ misc */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  padding: 8px 14px; cursor: pointer; color: var(--ink-3); font-size: 13.5px; font-weight: 500; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.dropzone { border: 1.5px dashed var(--line-strong); border-radius: var(--radius); background: var(--surface-sunk);
  padding: 30px 18px; text-align: center; cursor: pointer; }
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.preview { height: 460px; width: 100%; border: 0; background: var(--surface-sunk); }
.preview img { display: block; max-width: 100%; margin: 0 auto; }
.sigline { border-bottom: 1px solid var(--line-strong); min-height: 46px; display: flex; align-items: flex-end; padding-bottom: 3px; }
.sigline em { font-family: "Barlow Condensed", cursive, sans-serif; font-style: italic; font-size: 20px; color: var(--ink); }
.bar { height: 6px; background: var(--surface-sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; }
.toast { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast > div { background: var(--rail); color: #e9f1f2; padding: 10px 14px; border-radius: var(--radius);
  font-size: 13px; box-shadow: 0 8px 26px rgba(0,0,0,.3); border-left: 3px solid var(--accent); max-width: 380px; }
.toast > div.bad { border-left-color: var(--fail); }
.toast > div.good { border-left-color: var(--pass); }

@media (max-width: 1000px) {
  .rail { position: fixed; z-index: 60; transform: translateX(-100%); transition: transform .18s; }
  .rail.open { transform: none; }
  .burger { display: inline-flex; }
  .titleblock { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .titleblock > div:nth-child(5n) { border-right: 1px solid var(--line); }
  .titleblock > div:nth-child(2n) { border-right: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

@media print {
  .rail, .topbar, .no-print, .toast { display: none !important; }
  body { background: #fff; }
  .content { padding: 0; max-width: none; }
  .card { box-shadow: none; break-inside: avoid; }
  thead th { position: static; }
  tbody tr.row-fail { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<script>
"use strict";
/* ==========================================================================
   AI Drawing Inspection Standard Generator & Inspection Report System
   Single-file build. State lives in localStorage; uploaded drawing files are
   held in memory for the session only (object URLs), so a reload keeps the
   record but drops the preview.
   ========================================================================== */

/* ------------------------------------------------------------------ utils */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function num(v, dp = 4) {
  if (v === null || v === undefined || v === "" || Number.isNaN(Number(v))) return "—";
  return String(Number(v).toFixed(dp)).replace(/\.?0+$/, "");
}
function titleCase(s) { return String(s).replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase()); }
function fmtDate(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}
function fmtDateTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleString(undefined,
    { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function fmtBytes(n) {
  if (!n) return "—";
  const u = ["B", "KB", "MB", "GB"]; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(i ? 1 : 0) + " " + u[i];
}
function todayISO() { return new Date().toISOString().slice(0, 10); }

function toast(message, kind = "") {
  const el = document.createElement("div");
  if (kind) el.className = kind;
  el.textContent = message;
  $("#toast").append(el);
  setTimeout(() => el.remove(), 4200);
}

/* ------------------------------------------------- PASS / FAIL engine
   The single place a measurement is judged. Deliberately refuses to judge a
   specification the AI could not read: that returns PENDING, never PASS.      */
const PASS = "PASS", FAIL = "FAIL", PENDING = "PENDING", NA = "NA";

function limitsOf(p) {
  if (p.nominal_value === null || p.nominal_value === undefined) return [null, null];
  let lsl = p.lower_tolerance === null || p.lower_tolerance === undefined ? null : p.nominal_value + p.lower_tolerance;
  let usl = p.upper_tolerance === null || p.upper_tolerance === undefined ? null : p.nominal_value + p.upper_tolerance;
  if (lsl !== null && usl !== null && lsl > usl) { const t = lsl; lsl = usl; usl = t; }
  return [lsl, usl];
}

function evaluate(p, actualValue, manualResult) {
  if (p.requires_manual_verification)
    return { result: PENDING, deviation: null, reason: "Specification requires manual verification" };
  if (p.is_attribute) {
    if (manualResult === PASS || manualResult === FAIL || manualResult === NA)
      return { result: manualResult, deviation: null, reason: "Attribute verdict recorded by inspector" };
    return { result: PENDING, deviation: null, reason: "Awaiting inspector verdict" };
  }
  if (actualValue === null || actualValue === undefined || actualValue === "" || Number.isNaN(Number(actualValue)))
    return { result: PENDING, deviation: null, reason: "No measurement recorded" };

  const v = Number(actualValue);
  const [lsl, usl] = limitsOf(p);
  if (lsl === null && usl === null)
    return { result: PENDING, deviation: null, reason: "No usable tolerance on specification" };
  if (usl !== null && v > usl)
    return { result: FAIL, deviation: round6(v - usl), reason: "Above upper limit" };
  if (lsl !== null && v < lsl)
    return { result: FAIL, deviation: round6(v - lsl), reason: "Below lower limit" };
  return { result: PASS, deviation: 0, reason: "Within specification" };
}
function round6(n) { return Math.round(n * 1e6) / 1e6; }

/** Parse an inspector's reading list — "20.07, 20.11 20.06" → [20.07, 20.11, 20.06]. */
function parseReadings(text) {
  if (text === null || text === undefined) return [];
  if (Array.isArray(text)) return text.filter(v => Number.isFinite(Number(v))).map(Number);
  return String(text).split(/[\s,;/]+/).filter(Boolean)
    .map(Number).filter(Number.isFinite);
}

/**
 * Judge a whole sample. Every piece measured must be inside the limits — the
 * lot fails on its worst reading, and the deviation reported is that worst
 * excursion, which is how BNC-IQC-DIR01 records it.
 */
function evaluateSample(p, readings, manualResult) {
  if (p.requires_manual_verification)
    return { result: PENDING, deviation: null, min: null, max: null,
             reason: "Specification requires manual verification" };
  if (p.is_attribute) {
    if (manualResult === PASS || manualResult === FAIL || manualResult === NA)
      return { result: manualResult, deviation: null, min: null, max: null,
               reason: "Attribute verdict recorded by inspector" };
    return { result: PENDING, deviation: null, min: null, max: null,
             reason: "Awaiting inspector verdict" };
  }

  const values = parseReadings(readings);
  if (!values.length)
    return { result: PENDING, deviation: null, min: null, max: null,
             reason: "No measurement recorded" };

  const min = Math.min(...values), max = Math.max(...values);
  let result = PASS, worst = 0, reason = "All readings within specification";
  for (const v of values) {
    const one = evaluate(p, v);
    if (one.result === PENDING)
      return { result: PENDING, deviation: null, min, max, reason: one.reason };
    if (one.result === FAIL && Math.abs(one.deviation) > Math.abs(worst)) {
      result = FAIL; worst = one.deviation; reason = one.reason;
    }
  }
  return { result, deviation: result === FAIL ? round6(worst) : 0, min, max, reason };
}

function summarise(rows) {
  const total = rows.length;
  const passed  = rows.filter(r => r.result === PASS).length;
  const failed  = rows.filter(r => r.result === FAIL).length;
  const pending = rows.filter(r => r.result === PENDING).length;
  const crit  = rows.filter(r => r.result === FAIL && r.classification === "critical").length;
  const major = rows.filter(r => r.result === FAIL && r.classification === "major").length;
  const minor = rows.filter(r => r.result === FAIL && r.classification === "minor").length;
  let overall;
  if (total === 0 || pending > 0)   overall = "PENDING";
  else if (failed === 0)            overall = "ACCEPTED";
  else if (crit > 0 || major > 0)   overall = "REJECTED";
  else                              overall = "ACCEPTED_WITH_DEVIATION";
  return { total, passed, failed, pending, critical: crit, major, minor, overall };
}

function limitsText(p) {
  const [lsl, usl] = limitsOf(p);
  const unit = p.unit || "";
  if (lsl !== null && usl !== null) return `${num(lsl)} – ${num(usl)} ${unit}`.trim();
  if (usl !== null) return `max ${num(usl)} ${unit}`.trim();
  if (lsl !== null) return `min ${num(lsl)} ${unit}`.trim();
  return "—";
}
function tolText(p) {
  if (p.upper_tolerance == null && p.lower_tolerance == null) return "—";
  const u = p.upper_tolerance == null ? "—" : "+" + num(p.upper_tolerance);
  const l = p.lower_tolerance == null ? "—" : num(p.lower_tolerance);
  return `${u} / ${l}`;
}

const METHOD_TABLE = {
  length:         ["Variable measurement",   "DVC-150"],
  diameter:       ["Variable measurement",   "DVC-150"],
  radius:         ["Optical comparison",     "PPJ-300"],
  angle:          ["Angular measurement",    "PPJ-300"],
  hole:           ["Bore measurement",       "BM-25"],
  thread:         ["Attribute gauging",      "VIS"],
  appearance:     ["Visual inspection",      "VIS"],
  other:          ["Visual inspection",      "VIS"],
};
const FREQ = {
  critical: "100% inspection",
  major: "Every incoming lot",
  minor: "Every incoming lot",
};
/* BNC sampling per IS:2500 — sample size by lot quantity, rejection number 0. */
const IS2500 = "IS:2500 — 3 (0-99) / 5 (100-199) / 8 (200-499) / 10 (500-999) / 20 (>1000); Rej. no. 0";
const PLAN = {
  critical: "100% — no sampling permitted",
  major: IS2500,
  minor: IS2500,
};
const ATTRIBUTE_TYPES = new Set(["thread", "appearance", "other"]);

function acceptanceText(d) {
  if (d.requires_manual_verification) return "Requires Manual Verification";
  if (d.nominal_value === null || d.nominal_value === undefined) return d.specification_text || "As per drawing";
  const [lsl, usl] = limitsOf(d), unit = d.unit || "mm";
  if (lsl !== null && usl !== null) return `${num(lsl)} to ${num(usl)} ${unit}`;
  if (usl !== null) return `Max ${num(usl)} ${unit}`;
  if (lsl !== null) return `Min ${num(lsl)} ${unit}`;
  return `As per drawing: ${d.specification_text}`;
}

function buildParameters(extraction) {
  const out = [];
  extraction.dimensions.forEach((d, i) => {
    const type = d.dimension_type || "other";
    const [tableMethod, tableCode] = METHOD_TABLE[type] || METHOD_TABLE.other;
    // An extraction may name the instrument and method itself; that wins over the table.
    const method = d.inspection_method || tableMethod;
    const code = d.instrument_code || tableCode;
    const inst = db.instruments.find(x => x.code === code);
    const flagged = !!d.requires_manual_verification;
    const bits = [];
    if (d.gdt_symbol) bits.push(`GD&T: ${d.gdt_symbol}${d.datums ? " | datums " + d.datums : ""}`);
    if (flagged && d.verification_reasons?.length) bits.push("Requires Manual Verification — " + d.verification_reasons.join("; "));
    out.push({
      seq: i + 1,
      // Which section of the controlled document this row belongs to.
      characteristic_type: type === "appearance" ? "appearance" : "dimensional",
      parameter: d.label || `Characteristic ${i + 1}`,
      specification: d.specification_text || "",
      nominal_value: d.nominal_value ?? null,
      upper_tolerance: d.upper_tolerance ?? null,
      lower_tolerance: d.lower_tolerance ?? null,
      // Attribute characteristics have no unit of measure; don't inherit "mm".
      unit: d.unit || (ATTRIBUTE_TYPES.has(type) ? null : extraction.units || "mm"),
      inspection_method: method,
      instrument_id: inst ? inst.id : null,
      instrument_text: inst ? inst.name : null,
      frequency: FREQ[d.classification] || FREQ.minor,
      sampling_plan: PLAN[d.classification] || PLAN.minor,
      acceptance_criteria: acceptanceText(d),
      classification: d.classification || "minor",
      reference_dimension: d.reference || d.label || null,
      remarks: bits.join(" · ") || null,
      // An extraction may declare the characteristic an attribute outright.
      is_attribute: d.is_attribute
        ?? (ATTRIBUTE_TYPES.has(type) || (d.nominal_value == null && !flagged)),
      requires_manual_verification: flagged,
      source_confidence: d.confidence ?? null,
      source_note: d.source_note || null,
    });
  });
  (extraction.notes || []).filter(n => n.is_inspection_requirement).forEach(n => {
    const inst = db.instruments.find(x => x.code === "VIS");
    out.push({
      seq: out.length + 1,
      parameter: `Drawing note ${out.length + 1}`,
      specification: (n.text || "").slice(0, 240),
      nominal_value: null, upper_tolerance: null, lower_tolerance: null, unit: null,
      inspection_method: "Visual inspection / document check",
      instrument_id: inst ? inst.id : null,
      instrument_text: inst ? inst.name : null,
      frequency: "Once per lot", sampling_plan: "1 pc per lot",
      acceptance_criteria: "Conforms to drawing note",
      classification: "major", reference_dimension: "Notes", remarks: null,
      is_attribute: true,
      requires_manual_verification: (n.confidence ?? 0) < settings.threshold,
      source_confidence: n.confidence ?? null, source_note: "Extracted from drawing notes block",
    });
  });
  return out;
}

/* ================================================== AI extraction pipeline
   Anti-hallucination contract, enforced in three places:
   1. the prompt says omission is correct and invention is a critical failure;
   2. the tool schema makes every numeric field nullable and demands a
      per-item confidence and source_note;
   3. postprocess() flags anything under threshold, any missing nominal and
      any missing tolerance as requires_manual_verification — which the
      PASS/FAIL engine then refuses to judge and approval refuses to release.
   ======================================================================== */
const SYSTEM_PROMPT = `You are a senior manufacturing quality engineer reading an engineering drawing.

Extract ONLY what is actually legible on the drawing.

ABSOLUTE RULES — these override any desire to be helpful:
- NEVER invent, infer, complete or "standardise" a dimension, tolerance, material or note.
- If a value is unreadable, ambiguous, cropped or simply absent, return null for it and set
  confidence low with a source_note explaining what you could and could not see.
- Do NOT apply general tolerance tables from memory unless the drawing's own general-tolerance
  note is legible; if it is, quote it verbatim in general_tolerance_note.
- Never guess a decimal place. If you can read "25." but not the following digits, the value is
  null and the source_note says so.
- An incomplete but honest extraction is a success. A complete but fabricated one is a failure.

Report a confidence between 0 and 1 per item, meaning "probability this value is exactly what is
printed on the drawing". Use the units printed on the drawing.`;

const USER_PROMPT = `Read this engineering drawing and return the structured extraction.

Cover: title block (part name/number, drawing number, revision, material, scale, units, general
tolerance note), every dimension with its tolerance, every geometric tolerance (GD&T frame:
symbol, value, datums, material condition), surface finish callouts, hole specifications, thread
specifications, and any note that states an inspection or special-characteristic requirement.

Mark a characteristic critical/major/minor only when the drawing itself indicates it (a special
characteristic symbol, a note, or a balloon). Otherwise classify by engineering judgement and say
so in the source_note.`;

const EXTRACTION_TOOL = {
  name: "record_drawing_extraction",
  description: "Record technical content read from an engineering drawing.",
  input_schema: {
    type: "object",
    properties: {
      part_name:        { type: ["string", "null"] },
      part_number:      { type: ["string", "null"] },
      drawing_number:   { type: ["string", "null"] },
      drawing_revision: { type: ["string", "null"] },
      material:         { type: ["string", "null"] },
      units:            { type: ["string", "null"] },
      scale:            { type: ["string", "null"] },
      general_tolerance_note: { type: ["string", "null"],
        description: "Verbatim general-tolerance note, or null if not legible." },
      title_block_confidence: { type: "number" },
      dimensions: {
        type: "array",
        items: {
          type: "object",
          properties: {
            label:     { type: "string" },
            reference: { type: ["string", "null"], description: "balloon number or zone" },
            dimension_type: { type: "string",
              enum: ["length","diameter","radius","angle","hole","thread","surface_finish","geometric","other"] },
            nominal_value:   { type: ["number", "null"] },
            upper_tolerance: { type: ["number", "null"] },
            lower_tolerance: { type: ["number", "null"] },
            unit: { type: ["string", "null"] },
            specification_text: { type: "string", description: "Verbatim callout" },
            gdt_symbol: { type: ["string", "null"] },
            datums:     { type: ["string", "null"] },
            classification: { type: "string", enum: ["critical", "major", "minor"] },
            confidence:  { type: "number" },
            source_note: { type: "string" },
          },
          required: ["label","dimension_type","specification_text","classification","confidence","source_note"],
        },
      },
      notes: {
        type: "array",
        items: {
          type: "object",
          properties: {
            text: { type: "string" },
            is_inspection_requirement: { type: "boolean" },
            confidence: { type: "number" },
          },
          required: ["text", "confidence"],
        },
      },
      unreadable_areas: { type: "array", items: { type: "string" } },
    },
    required: ["dimensions", "title_block_confidence"],
  },
};

function asFloat(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function postprocess(raw, engine) {
  const threshold = settings.threshold;
  const dims = (raw.dimensions || []).map(item => {
    const d = { ...item };
    d.classification = d.classification || "minor";
    d.confidence = asFloat(d.confidence) ?? 0;
    d.source_note = d.source_note || "";
    d.unit = d.unit || raw.units || "mm";
    d.nominal_value   = asFloat(d.nominal_value);
    d.upper_tolerance = asFloat(d.upper_tolerance);
    d.lower_tolerance = asFloat(d.lower_tolerance);

    const reasons = [];
    if (d.confidence < threshold)
      reasons.push(`AI confidence ${d.confidence.toFixed(2)} below ${threshold.toFixed(2)}`);
    const variable = d.dimension_type !== "other";
    if (variable && d.nominal_value === null) reasons.push("Nominal value not read from drawing");
    if (variable && d.nominal_value !== null && d.upper_tolerance === null && d.lower_tolerance === null)
      reasons.push("No tolerance read from drawing");
    if (!String(d.specification_text || "").trim()) reasons.push("Specification text missing");

    d.requires_manual_verification = reasons.length > 0;
    d.verification_reasons = reasons;
    return d;
  });

  const titleConf = asFloat(raw.title_block_confidence) ?? 0;
  const headerFlags = {};
  ["part_name", "part_number", "drawing_number", "drawing_revision", "material"].forEach(f => {
    headerFlags[f] = !raw[f] || titleConf < threshold;
  });
  const confs = dims.map(d => d.confidence);
  const overall = confs.length ? round6(confs.reduce((a, b) => a + b, 0) / confs.length) : 0;

  return {
    part_name: raw.part_name ?? null, part_number: raw.part_number ?? null,
    drawing_number: raw.drawing_number ?? null, drawing_revision: raw.drawing_revision ?? null,
    material: raw.material ?? null, units: raw.units || "mm", scale: raw.scale ?? null,
    general_tolerance_note: raw.general_tolerance_note ?? null,
    title_block_confidence: titleConf, header_requires_verification: headerFlags,
    dimensions: dims, notes: raw.notes || [], unreadable_areas: raw.unreadable_areas || [],
    pages_analysed: raw.pages_analysed ?? 1, engine,
    confidence_threshold: threshold, overall_confidence: overall,
  };
}

/** Offline extractor. Every field is null and unverified — it never pretends to have read a drawing. */
function offlineExtraction(fileName) {
  return postprocess({
    drawing_number: (fileName || "").replace(/\.[^.]+$/, "").slice(0, 40) || null,
    units: "mm", title_block_confidence: 0,
    dimensions: [{
      label: "Placeholder characteristic 1", reference: "1", dimension_type: "length",
      nominal_value: null, upper_tolerance: null, lower_tolerance: null,
      specification_text: "Not extracted — offline mode", classification: "major",
      confidence: 0, source_note: "No AI provider configured; nothing was read from the drawing.",
    }],
    notes: [], unreadable_areas: ["Entire drawing — AI extraction not configured"],
    pages_analysed: 0,
  }, "offline-stub");
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(",")[1]);
    fr.onerror = () => reject(new Error("Could not read the file"));
    fr.readAsDataURL(file);
  });
}

/** Live vision call. Runs from the browser, so it needs the direct-access header. */
async function extractWithAI(file) {
  const mediaType = file.type === "application/pdf" ? "application/pdf" : file.type;
  const data = await fileToBase64(file);
  const source = file.type === "application/pdf"
    ? { type: "base64", media_type: "application/pdf", data }
    : { type: "base64", media_type: mediaType, data };

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": settings.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: settings.model,
      max_tokens: 8000,
      system: SYSTEM_PROMPT,
      tools: [EXTRACTION_TOOL],
      tool_choice: { type: "tool", name: EXTRACTION_TOOL.name },
      messages: [{
        role: "user",
        content: [
          { type: file.type === "application/pdf" ? "document" : "image", source },
          { type: "text", text: USER_PROMPT },
        ],
      }],
    }),
  });

  if (!res.ok) {
    let detail = res.statusText;
    try { const body = await res.json(); detail = body.error?.message || detail; } catch (e) { /* keep statusText */ }
    throw new Error(`Vision API ${res.status}: ${detail}`);
  }
  const body = await res.json();
  const block = (body.content || []).find(b => b.type === "tool_use");
  if (!block) throw new Error("The model returned no structured extraction");
  return postprocess(block.input, `anthropic:${settings.model}`);
}

/* ================================================================== charts
   Hand-drawn SVG: a faint grid, tabular values, an emphasised endpoint. No
   external chart library, so the file stays self-contained and offline.      */
function svgWrap(w, h, inner) {
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img"
    style="display:block;overflow:visible">${inner}</svg>`;
}
function gridLines(x0, y0, w, h, steps, max) {
  let out = "";
  for (let i = 0; i <= steps; i++) {
    const y = y0 + h - (h * i) / steps;
    out += `<line x1="${x0}" y1="${y}" x2="${x0 + w}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    out += `<text x="${x0 - 7}" y="${y + 3.5}" text-anchor="end" font-size="10"
      fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">${num((max * i) / steps, 0)}</text>`;
  }
  return out;
}

/** Grouped bars + a line, used for the inspection trend. */
function trendChart(points) {
  if (!points.length) return `<div class="empty">No inspections in this period</div>`;
  const W = 780, H = 250, PADL = 40, PADB = 34, PADT = 12;
  const w = W - PADL - 12, h = H - PADB - PADT;
  const max = Math.max(4, ...points.map(p => p.inspections));
  const step = w / points.length;
  const bw = Math.max(4, Math.min(20, step / 3.1));

  let bars = "", labels = "", path = "";
  points.forEach((p, i) => {
    const cx = PADL + step * i + step / 2;
    const hp = (p.passed / max) * h, hf = (p.failed / max) * h;
    bars += `<rect x="${cx - bw - 1}" y="${PADT + h - hp}" width="${bw}" height="${hp}"
      fill="var(--pass)" rx="1"><title>${esc(p.period)} — ${p.passed} accepted</title></rect>`;
    bars += `<rect x="${cx + 1}" y="${PADT + h - hf}" width="${bw}" height="${hf}"
      fill="var(--fail)" rx="1"><title>${esc(p.period)} — ${p.failed} with failures</title></rect>`;
    const y = PADT + h - (p.inspections / max) * h;
    path += `${i ? "L" : "M"}${cx} ${y} `;
    if (points.length <= 16 || i % Math.ceil(points.length / 12) === 0)
      labels += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="10"
        fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">${esc(p.period.slice(-5))}</text>`;
  });
  const last = points[points.length - 1];
  const lastX = PADL + step * (points.length - 1) + step / 2;
  const lastY = PADT + h - (last.inspections / max) * h;

  return svgWrap(W, H,
    gridLines(PADL, PADT, w, h, 4, max) + bars +
    `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.8"
       stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${lastX}" cy="${lastY}" r="3.5" fill="var(--accent)"/>` +
    `<circle cx="${lastX}" cy="${lastY}" r="7" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".4"/>` +
    labels);
}

/** Classic Pareto: descending bars plus the cumulative % line and the 80 % rule. */
function paretoChart(points) {
  if (!points.length) return `<div class="empty">No failures recorded — every characteristic passed</div>`;
  const W = 760, H = 300, PADL = 38, PADR = 40, PADB = 96, PADT = 12;
  const w = W - PADL - PADR, h = H - PADB - PADT;
  const max = Math.max(...points.map(p => p.count));
  const step = w / points.length;
  const bw = Math.min(38, step * 0.62);

  let bars = "", labels = "", line = "", dots = "";
  points.forEach((p, i) => {
    const cx = PADL + step * i + step / 2;
    const bh = (p.count / max) * h;
    bars += `<rect x="${cx - bw / 2}" y="${PADT + h - bh}" width="${bw}" height="${bh}"
      fill="var(--warn)" rx="1"><title>${esc(p.label)} — ${p.count}</title></rect>`;
    const y = PADT + h - (p.cumulative / 100) * h;
    line += `${i ? "L" : "M"}${cx} ${y} `;
    dots += `<circle cx="${cx}" cy="${y}" r="2.6" fill="var(--accent)"/>`;
    const text = p.label.length > 24 ? p.label.slice(0, 23) + "…" : p.label;
    labels += `<text x="${cx}" y="${PADT + h + 10}" font-size="10" fill="var(--ink-3)"
      transform="rotate(-38 ${cx} ${PADT + h + 10})" text-anchor="end">${esc(text)}</text>`;
  });
  const y80 = PADT + h - 0.8 * h;

  return svgWrap(W, H,
    gridLines(PADL, PADT, w, h, 4, max) +
    `<line x1="${PADL}" y1="${y80}" x2="${PADL + w}" y2="${y80}" stroke="var(--accent-line)"
       stroke-width="1" stroke-dasharray="4 3"/>` +
    `<text x="${PADL + w + 4}" y="${y80 + 3.5}" font-size="10" fill="var(--ink-3)"
       font-family="IBM Plex Mono, monospace">80%</text>` +
    bars +
    `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>` + dots + labels);
}

/** Horizontal ranked bars, used for part-wise defect analysis. */
function rankedBars(rows, colourFor) {
  if (!rows.length) return `<div class="empty">No data yet</div>`;
  const max = Math.max(...rows.map(r => r.value)) || 1;
  return `<div style="display:grid;gap:9px">` + rows.map(r => `
    <div>
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:3px">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>
        <b class="num mono" style="font-size:12px">${num(r.value, 0)}</b>
      </div>
      <div class="bar"><i style="width:${Math.max(2, (r.value / max) * 100)}%;background:${colourFor(r)}"></i></div>
    </div>`).join("") + `</div>`;
}

/** Donut for the severity split. */
function donut(rows, colours) {
  const total = rows.reduce((a, r) => a + r.value, 0);
  if (!total) return `<div class="empty">No failures recorded</div>`;
  const R = 74, r0 = 46, cx = 96, cy = 96;
  let angle = -Math.PI / 2, paths = "";
  rows.forEach(row => {
    const sweep = (row.value / total) * Math.PI * 2;
    const end = angle + sweep;
    const large = sweep > Math.PI ? 1 : 0;
    const p = (rad, radius) => `${cx + Math.cos(rad) * radius} ${cy + Math.sin(rad) * radius}`;
    paths += `<path d="M${p(angle, R)} A${R} ${R} 0 ${large} 1 ${p(end, R)}
      L${p(end, r0)} A${r0} ${r0} 0 ${large} 0 ${p(angle, r0)} Z"
      fill="${colours[row.label] || "var(--line-strong)"}" stroke="var(--surface)" stroke-width="1.5">
      <title>${esc(titleCase(row.label))} — ${row.value}</title></path>`;
    angle = end;
  });
  const legend = rows.map(r => `
    <div style="display:flex;align-items:center;gap:7px;font-size:12.5px">
      <span style="width:9px;height:9px;border-radius:2px;background:${colours[r.label] || "var(--line-strong)"}"></span>
      <span style="flex:1">${esc(titleCase(r.label))}</span>
      <b class="num mono" style="font-size:12px">${r.value}</b>
    </div>`).join("");
  return `<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 192 192" width="180" height="180" style="flex:none">${paths}
      <text x="96" y="92" text-anchor="middle" font-size="26" font-weight="600"
        fill="var(--ink)" font-family="Barlow Condensed, sans-serif">${total}</text>
      <text x="96" y="108" text-anchor="middle" font-size="10" fill="var(--ink-3)"
        font-family="Barlow Condensed, sans-serif" letter-spacing="1.4">FAILURES</text></svg>
    <div style="display:grid;gap:8px;flex:1;min-width:150px">${legend}</div></div>`;
}

const CHIP_TONE = {

/* ============================================================== dashboard */
function dashboardView() {
  const reports = db.reports;

/* ------------------------------------------------------ dashboard queries */
function bucketOf(iso, gran) {
  const d = new Date(iso);
  if (gran === "monthly") return iso.slice(0, 7);
  if (gran === "weekly") {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    const week = Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
    return `${t.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
  }
  return iso;
}
function trendData(gran) {
  const map = new Map();
  db.reports.forEach(r => {
    if (!r.inspection_date) return;
    const key = bucketOf(r.inspection_date, gran);
    const row = map.get(key) || { period: key, inspections: 0, passed: 0, failed: 0 };
    row.inspections++;
    if (r.overall_result === "ACCEPTED") row.passed++;
    else if (r.failed_parameters) row.failed++;
    map.set(key, row);
  });
  return [...map.values()].sort((a, b) => a.period.localeCompare(b.period)).slice(-18);
}
function paretoData(limit) {
  const counts = new Map();
  db.results.filter(r => r.result === FAIL).forEach(r => {
    const p = byId("parameters", r.parameter_id);
    if (!p) return;
    counts.set(p.parameter, (counts.get(p.parameter) || 0) + 1);
  });
  const rows = [...counts.entries()].map(([label, count]) => ({ label, count }))
    .sort((a, b) => b.count - a.count);
  const total = rows.reduce((a, r) => a + r.count, 0);
  let run = 0;
  return rows.slice(0, limit).map(r => {
    run += r.count;
    return { ...r, cumulative: total ? round6(run / total * 100) : 0 };
  });
}
function severityData() {
  const counts = { critical: 0, major: 0, minor: 0 };
  db.results.filter(r => r.result === FAIL).forEach(r => {
    const p = byId("parameters", r.parameter_id);
    if (p) counts[p.classification] = (counts[p.classification] || 0) + 1;
  });
  return Object.entries(counts).filter(([, v]) => v > 0).map(([label, value]) => ({ label, value }));
}
function partData() {
  const map = new Map();
  db.reports.forEach(r => {
    const part = byId("parts", r.part_id);
    if (!part) return;
    map.set(part.part_number, (map.get(part.part_number) || 0) + r.failed_parameters);
  });
  return [...map.entries()].map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value).slice(0, 8);
}
function supplierTable() {
  const rows = db.suppliers.map(s => {
    const reports = db.reports.filter(r => r.supplier_id === s.id);
    const passed = reports.reduce((a, r) => a + r.passed_parameters, 0);
    const failed = reports.reduce((a, r) => a + r.failed_parameters, 0);
    const rate = passed + failed ? passed / (passed + failed) * 100 : 0;
    return { name: s.name, reports: reports.length, rate };
  }).filter(r => r.reports).sort((a, b) => b.rate - a.rate);
  if (!rows.length) return emptyState("No supplier data yet");
  return `<div class="tablewrap"><table>
    <thead><tr><th>Supplier</th><th class="r">Reports</th><th class="r">Pass rate</th><th style="width:34%">Rating</th></tr></thead>
    <tbody>${rows.map(r => {
      const colour = r.rate >= 98 ? "var(--pass)" : r.rate >= 92 ? "var(--warn)" : "var(--fail)";
      return `<tr><td>${esc(r.name)}</td><td class="r num">${r.reports}</td>
        <td class="r num mono" style="color:${colour};font-weight:600">${r.rate.toFixed(1)}%</td>
        <td><div class="bar"><i style="width:${Math.min(100, r.rate)}%;background:${colour}"></i></div></td></tr>`;
    }).join("")}</tbody></table></div>`;
}
function inspectorTable() {
  const rows = db.users.filter(u => db.reports.some(r => r.inspector_id === u.id)).map(u => {
    const reports = db.reports.filter(r => r.inspector_id === u.id);
    return { name: u.full_name, reports: reports.length,
      found: reports.reduce((a, r) => a + r.failed_parameters, 0) };
  }).sort((a, b) => b.reports - a.reports);
  if (!rows.length) return emptyState("No inspector data yet");
  return `<div class="tablewrap"><table>
    <thead><tr><th>Inspector</th><th class="r">Reports</th><th class="r">Failures found</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td>
      <td class="r num">${r.reports}</td><td class="r num">${r.found}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ------------------------------------------------------- drawing actions */
async function runAnalysis(drawingId) {
  const drawing = byId("drawings", drawingId);
  const rev = db.revisions.find(r => r.drawing_id === drawing.id && r.is_current);
  if (!rev) return toast("This drawing has no current revision", "bad");
  const ext = (drawing.file_name || "").toLowerCase().split(".").pop();
  if (ext === "dwg" || ext === "dxf")
    return toast("Native CAD must be exported to PDF before AI analysis", "bad");

  drawing.status = rev.status = "analyzing"; save(); render();
  toast("Reading the drawing…");

  try {
    const file = state.files?.get(drawing.id);
    let extraction;
    if (settings.apiKey && file) {
      extraction = await extractWithAI(file);
    } else if (settings.apiKey && !file) {
      throw new Error("The original file is no longer in this session — re-upload it to analyse");
    } else {
      await new Promise(r => setTimeout(r, 700));
      extraction = drawing.drawing_number === "DWG-4471"
        ? demoExtraction() : offlineExtraction(drawing.file_name);
    }
    rev.extraction = extraction;
    rev.extraction_confidence = extraction.overall_confidence;
    rev.extraction_engine = extraction.engine;
    rev.extraction_error = null;
    rev.analyzed_at = new Date().toISOString();
    rev.status = drawing.status = "analyzed";
    if (extraction.drawing_revision && (rev.revision === "-" || !rev.revision))
      rev.revision = String(extraction.drawing_revision).slice(0, 20);
    const part = byId("parts", drawing.part_id);
    if (part && extraction.material && !part.material) part.material = extraction.material;

    state.draftExtraction = null;
    audit("drawing.analyze", "drawing_revision", rev.id,
      { engine: extraction.engine, characteristics: extraction.dimensions.length });
    save(); render();
    const unver = extraction.dimensions.filter(d => d.requires_manual_verification).length;
    toast(unver ? `Analysis complete — ${unver} characteristic(s) need manual verification`
                : "Analysis complete — all characteristics read confidently", unver ? "" : "good");
  } catch (err) {
    drawing.status = rev.status = "failed";
    rev.extraction_error = err.message;
    audit("drawing.analyze.failed", "drawing", drawing.id, { error: err.message });
    save(); render();
    toast(err.message, "bad");
  }
}

function generateStandard(revId) {
  const rev = byId("revisions", revId);
  const extraction = state.draftExtraction || rev.extraction;
  if (!extraction) return toast("Run the AI analysis first", "bad");
  persistExtraction(revId, { silent: true });

  const drawing = byId("drawings", rev.drawing_id);
  const version = db.standards.filter(s => s.drawing_revision_id === rev.id).length + 1;
  const standard = {
    id: nextId("standards"),
    code: `IS-${drawing.drawing_number}-${rev.revision}-v${version}`.replace(/\s+/g, ""),
    title: `Inspection Standard — ${drawing.title || drawing.drawing_number} (Rev ${rev.revision})`,
    drawing_revision_id: rev.id, part_id: drawing.part_id, version,
    status: "draft", notes: null,
    created_by_id: state.user.id, approved_by_id: null, approved_at: null,
    created_at: new Date().toISOString(),
  };
  db.standards.push(standard);
  buildParameters(extraction).forEach(p =>
    db.parameters.push({ id: nextId("parameters"), standard_id: standard.id, ...p }));

  audit("standard.generate", "standard", standard.id, { version });
  state.draftExtraction = null;
  save();
  toast(`Generated ${standard.code}`, "good");
  go(`#/standards/${standard.id}`);
}

function persistExtraction(revId, opts = {}) {
  const rev = byId("revisions", revId);
  if (!rev || !state.draftExtraction) { if (!opts.silent) toast("Nothing to save"); return; }
  rev.extraction = state.draftExtraction;
  rev.extraction_confidence = state.draftExtraction.overall_confidence;
  rev.verified_by_id = state.user.id;
  rev.verified_at = new Date().toISOString();
  audit("extraction.verify", "drawing_revision", rev.id);
  state.draftExtraction = null;
  save();
  if (!opts.silent) { render(); toast("Verified extraction saved", "good"); }
}

/* -------------------------------------------------------- report detail */
function reportRows(report) {
  return db.results.filter(r => r.report_id === report.id)
    .sort((a, b) => a.seq - b.seq)
    .map(row => {
      const p = byId("parameters", row.parameter_id);
      const draft = state.drafts?.[row.id];
      const readings = draft && "readings" in draft ? draft.readings : (row.readings ?? "");
      const manual = draft && "manual_result" in draft
        ? draft.manual_result
        : (p.is_attribute && row.result !== PENDING ? row.result : null);
      return { row, p, draft, readings, manual, verdict: evaluateSample(p, readings, manual) };
    });
}

function reportDetailView(id) {
  const report = byId("reports", id);
  if (!report) return `<div class="note fail">Inspection report not found.</div>`;
  const rows = reportRows(report);
  const part = byId("parts", report.part_id);
  const drawing = byId("drawings", report.drawing_id);
  const supplier = byId("suppliers", report.supplier_id);
  const openForEdit = (report.status === "draft" || report.status === "submitted") && can("inspector");
  const live = summarise(rows.map(r => ({ result: r.verdict.result, classification: r.p.classification })));
  const dirty = !!state.drafts && Object.keys(state.drafts).length > 0;
  const sampleQty = report.sample_quantity || 0;

  const notices = [];
  if (dirty) notices.push(`<div class="note warn">Unsaved measurements. The verdicts below are a live preview —
    save to record them and update the summary.</div>`);
  if (live.pending && openForEdit) notices.push(`<div class="note info">${live.pending} parameter${
    live.pending === 1 ? "" : "s"} awaiting a result. The report cannot be submitted until every row is judged.</div>`);
  if (report.critical_failures) notices.push(`<div class="note fail"><b>${report.critical_failures}</b>
    critical characteristic${report.critical_failures === 1 ? "" : "s"} out of tolerance — this lot cannot ship on this report.</div>`);

  return pageHead(report.report_number,
    `${esc(part?.part_name || "—")} · ${esc(part?.part_number || "—")} · Drawing
     ${esc(drawing?.drawing_number || "—")} Rev ${esc(report.drawing_revision || "—")}
     ${chip(report.status)} ${chip(report.overall_result)}`,
    `<a class="btn" href="#/reports">Back</a>
     <a class="btn" href="#/reports/${report.id}/doc">Controlled document</a>
     <button class="btn" data-act="export-report" data-id="${report.id}">Export CSV</button>
     ${openForEdit ? `<button class="btn primary" data-act="save-results" data-id="${report.id}">
        ${dirty ? "Save results" : "Re-evaluate"}</button>` : ""}
     ${openForEdit && report.status === "draft"
        ? `<button class="btn primary" data-act="sign" data-id="${report.id}">Sign &amp; submit</button>` : ""}
     ${report.status === "submitted" && can("quality_manager")
        ? `<button class="btn primary" data-act="qa" data-id="${report.id}">QA decision</button>` : ""}`) +

  (notices.length ? `<div class="stack no-print" style="margin-bottom:16px">${notices.join("")}</div>` : "") +

  `<div style="margin-bottom:16px">${titleBlock([
    ["Company name", report.company_name], ["Supplier name", supplier?.name],
    ["Customer name", report.customer_name], ["Part name", part?.part_name],
    ["Part number", part?.part_number, true],
    ["Drawing number", drawing?.drawing_number, true], ["Drawing revision", report.drawing_revision],
    ["Batch / lot number", report.batch_number, true], ["PO number", report.po_number, true],
    ["Invoice number", report.invoice_number, true],
    ["Inspection date", fmtDate(report.inspection_date)], ["Shift", report.shift],
    ["Machine number", report.machine_number], ["Operator name", report.operator_name],
    ["Inspector name", report.inspector_name],

/* --------------------------------------------------------- report actions */
function recalcReport(report) {
  const rows = db.results.filter(r => r.report_id === report.id)
    .map(r => ({ result: r.result, classification: byId("parameters", r.parameter_id).classification }));
  const s = summarise(rows);
  Object.assign(report, {
    total_parameters: s.total, passed_parameters: s.passed, failed_parameters: s.failed,
    pending_parameters: s.pending, critical_failures: s.critical,
    major_failures: s.major, minor_failures: s.minor, overall_result: s.overall,
    updated_at: new Date().toISOString(),
  });
  if (report.status === "draft" && report.lot_quantity) {
    if (s.overall === "ACCEPTED") {
      report.accepted_quantity = report.lot_quantity;
      report.rejected_quantity = report.rework_quantity = 0;
    } else if (s.overall === "REJECTED") {
      report.rejected_quantity = report.lot_quantity;
      report.accepted_quantity = report.rework_quantity = 0;
    }
  }
  return s;
}

function saveResults(reportId) {
  const report = byId("reports", reportId);
  const drafts = state.drafts || {};
  Object.entries(drafts).forEach(([resultId, draft]) => {
    const row = byId("results", resultId);
    if (!row) return;
    const p = byId("parameters", row.parameter_id);
    if ("readings" in draft) row.readings = draft.readings;
    if ("remarks" in draft) row.remarks = draft.remarks;
    if ("defect_id" in draft) row.defect_id = draft.defect_id;
    if ("defect_description" in draft) row.defect_description = draft.defect_description;
    if ("manual_result" in draft) row.actual_text =
      draft.manual_result === PASS ? "Conforms" : draft.manual_result === FAIL ? "Does not conform" : row.actual_text;

    const manual = "manual_result" in draft
      ? draft.manual_result
      : (p.is_attribute && row.result !== PENDING ? row.result : null);
    const verdict = evaluateSample(p, row.readings, manual);
    row.result = verdict.result;
    row.deviation = verdict.deviation;
    row.reading_min = verdict.min;
    row.reading_max = verdict.max;
    // Keep a single representative value so summaries and exports stay simple.
    row.actual_value = verdict.max ?? null;
    if (verdict.result !== FAIL) { row.defect_id = null; row.defect_description = null; }
    else if (!row.defect_description) row.defect_description = verdict.reason;
  });

  const s = recalcReport(report);
  state.drafts = {};
  audit("report.results.save", "report", report.id, { overall: s.overall });
  save(); render();
  toast(`Saved — ${titleCase(s.overall)} · ${s.passed} pass, ${s.failed} fail`,
        s.overall === "ACCEPTED" ? "good" : s.failed ? "bad" : "");
}

function submitReport(reportId, signature) {
  const report = byId("reports", reportId);
  const s = recalcReport(report);
  if (s.pending) { toast(`${s.pending} parameter(s) still pending a result`, "bad"); return false; }
  report.status = "submitted";
  report.inspector_signature = signature;
  report.inspector_signed_at = new Date().toISOString();
  audit("report.submit", "report", report.id);
  save(); render();
  toast("Report signed and submitted for QA approval", "good");
  return true;
}

function qaDecide(reportId, decision, payload) {
  const report = byId("reports", reportId);
  report.accepted_quantity = payload.accepted;
  report.rejected_quantity = payload.rejected;
  report.rework_quantity = payload.rework;
  report.status = decision;
  report.qa_approver_id = state.user.id;
  report.qa_signature = payload.signature;
  report.qa_remarks = payload.remarks || null;
  report.qa_approved_at = new Date().toISOString();
  audit(`report.qa.${decision}`, "report", report.id, { remarks: payload.remarks });
  save(); render();
  toast(`Report ${decision}`, decision === "approved" ? "good" : "bad");
}

function createReport(standardId, form) {
  const standard = byId("standards", standardId);
  if (standard.status !== "approved") return toast("The standard must be approved first", "bad");
  const rev = byId("revisions", standard.drawing_revision_id);
  const year = new Date().getFullYear();
  const seq = db.reports.filter(r => r.report_number.startsWith(`IR-${year}-`)).length + 1;
  const part = byId("parts", standard.part_id);

  const report = {
    id: nextId("reports"), report_number: `IR-${year}-${String(seq).padStart(5, "0")}`,
    standard_id: standard.id, part_id: standard.part_id,
    drawing_id: rev ? rev.drawing_id : null, drawing_revision: rev ? rev.revision : null,
    supplier_id: form.supplier_id ? Number(form.supplier_id) : null,
    company_name: "BNC Motors Pvt Ltd",
    customer_name: part?.customer_name || null,
    batch_number: form.batch_number || null, po_number: form.po_number || null,
    invoice_number: form.invoice_number || null,
    inspection_date: form.inspection_date || todayISO(), shift: form.shift || null,
    machine_number: form.machine_number || null, operator_name: form.operator_name || null,
    inspector_id: state.user.id, inspector_name: state.user.full_name,
    lot_quantity: Number(form.lot_quantity) || 0, sample_quantity: Number(form.sample_quantity) || 0,
    accepted_quantity: 0, rejected_quantity: 0, rework_quantity: 0,
    total_parameters: 0, passed_parameters: 0, failed_parameters: 0, pending_parameters: 0,
    critical_failures: 0, major_failures: 0, minor_failures: 0, overall_result: "PENDING",
    status: "draft", inspector_signature: null, inspector_signed_at: null,
    qa_approver_id: null, qa_signature: null, qa_approved_at: null, qa_remarks: null,
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
  };
  db.reports.push(report);
  db.parameters.filter(p => p.standard_id === standard.id).sort((a, b) => a.seq - b.seq).forEach(p =>
    db.results.push({ id: nextId("results"), report_id: report.id, parameter_id: p.id, seq: p.seq,
      readings: "", reading_min: null, reading_max: null,
      actual_value: null, actual_text: null, result: PENDING, deviation: null,
      defect_id: null, defect_description: null, remarks: null }));
  recalcReport(report);
  audit("report.create", "report", report.id, { standard: standard.code });
  save();
  toast(`Created ${report.report_number}`, "good");
  go(`#/reports/${report.id}`);
}

/* ================================================================ exports */
function toCsv(rows) {
  return rows.map(r => r.map(v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(",")).join("\r\n");
}
function downloadCsv(filename, rows) {
  const blob = new Blob(["﻿" + toCsv(rows)], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Downloaded ${filename}`, "good");
}

function exportReportCsv(reportId) {
  const report = byId("reports", reportId);
  const part = byId("parts", report.part_id), drawing = byId("drawings", report.drawing_id);
  const rows = [
    ["INSPECTION REPORT", report.report_number],
    [],
    ["Company name", report.company_name, "Supplier name", byId("suppliers", report.supplier_id)?.name || "", "Customer name", report.customer_name],
    ["Part name", part?.part_name || "", "Part number", part?.part_number || "", "Drawing number", drawing?.drawing_number || ""],
    ["Drawing revision", report.drawing_revision, "Batch / lot number", report.batch_number, "PO number", report.po_number],
    ["Invoice number", report.invoice_number, "Inspection date", report.inspection_date, "Shift", report.shift],
    ["Machine number", report.machine_number, "Operator name", report.operator_name, "Inspector name", report.inspector_name],
    [],
    ["S.No", "Inspection parameter", "Specification", "Tolerance", "Inspection method", "Instrument",
     "Actual readings", "Min", "Max", "Result", "Deviation", "Defect description", "Inspector remarks"],
  ];
  db.results.filter(r => r.report_id === report.id).sort((a, b) => a.seq - b.seq).forEach(r => {
    const p = byId("parameters", r.parameter_id);
    rows.push([r.seq, p.parameter, `${p.specification} ${p.unit || ""}`.trim(), tolText(p),
      p.inspection_method || "", byId("instruments", p.instrument_id)?.name || p.instrument_text || "",
      p.is_attribute ? (r.actual_text || "") : (r.readings || ""),
      r.reading_min ?? "", r.reading_max ?? "",
      r.result, r.deviation ?? "", r.defect_description || "", r.remarks || ""]);
  });
  rows.push([], ["FINAL INSPECTION SUMMARY"],
    ["Total parameters checked", report.total_parameters],
    ["Passed parameters", report.passed_parameters],
    ["Failed parameters", report.failed_parameters],
    ["Critical failures", report.critical_failures],

    ["QA approval", report.qa_signature || "", "Approved at", report.qa_approved_at || ""],
    ["Digital approval status", report.status.toUpperCase()],
    ["QA remarks", report.qa_remarks || ""]);

}
